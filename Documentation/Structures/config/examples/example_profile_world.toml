# Example-Profile: a world built from a radial data file rather than layer tables, showing `data_file`, the ways a
# table refines detected layers, and a world file overriding the RK45 default such worlds pin.
#
# The profile (radius, density, Vp, Vs, and optionally viscosities; columns found by name) is split into layers at
# every solid-liquid transition and at every radius it gives twice (a discontinuity), and each layer's slice of it
# becomes that layer's interpolated material. A profile holds no rheology, cooling model, or radiogenics, so a
# [layers.<name>] table names the detected layer it refines (by `layer_index`, or by being called layer_N), or every
# detected layer between two detected boundaries (by `radius_range_m`), and adds them; only the layers being refined
# need a table, and a provided outer radius has to match the detected boundary. The bundled PREM.csv gives twelve
# layers: a solid inner core, a liquid outer core, and ten solid mantle and crust layers between PREM's
# discontinuities. From Python the same world takes a `data` mapping of arrays in place of `data_file`.
#
# The reference is resolved relative to this file's directory, then the worlds data directory, then the packaged
# WorldPack, so "PREM.csv" finds the bundled profile from anywhere. A saved copy of a built world keeps this
# reference (portable_config), not the expanded profile.

schema_version = "0.2.0"
name = "Example-Profile"
type = "terrestrial"
radius_m = 6371000.0
mass_kg = 5.972e24
spin_frequency_rad_s = 7.292e-5
data_file = "PREM.csv"

# A data-file world pins RK45 for its equation-of-state solve unless its file says otherwise; this one says so.
[eos_solver]
integration_method = "DOP853"
rtol = 1.0e-9

[tides]
global_tidal_model = "rheology"
love_method = "radial_solver"

# Refines every detected layer from the core-mantle boundary to the surface, naming them mantle_0 to mantle_9 from
# the inside out, and gives each a rheology, a viscosity, and a temperature; the profile's own density and moduli
# stay. Its material table merges over each layer's slice of the profile, which is a solid phase of radius-tabulated
# laws; a law it names is added (or, naming another model, replaces the profile's). Every key applies to each layer,
# so a share such as tidal_scale is left to its default (each layer's volume fraction).
[layers.mantle]
radius_range_m = [3480.0e3, 6371.0e3]
use_tides = true
temperature_k = 1600.0

[layers.mantle.shear_rheology]
model = "andrade"
alpha = 0.3
zeta = 1.0

[layers.mantle.material.solid.shear_viscosity]
model = "constant"                      # the profile named no viscosity, so give one here
reference_viscosity_pas = 1.0e21

# Refines the innermost detected layer by its detected name, layer_0, and only to switch its dissipation on.
[layers.layer_0]
use_tides = true
tidal_scale = 0.001
temperature_k = 5500.0

[layers.layer_0.material.solid.shear_viscosity]
model = "constant"
reference_viscosity_pas = 1.0e20
