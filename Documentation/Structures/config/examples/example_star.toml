# Example-Star: a star with no layers (it may have some), showing the stellar scalars, the [luminosity] model (stars
# only), and analytic tides (cpl, ctl, or ctl_q). The stored luminosity is luminosity_w, or from the effective
# temperature when zero; the [luminosity] model replaces both only when update_luminosity_from_mass() is called.

schema_version = "0.2.0"
name = "Example-Star"
type = "star"
radius_m = 6.957e8
mass_kg = 1.989e30
albedo = 0.0
emissivity = 1.0
obliquity_rad = 0.0
spin_frequency_rad_s = 2.9e-6
moment_of_inertia_factor = 0.0754   # an n = 3 polytrope, the [worlds.star] default
effective_temperature_k = 5772.0    # photospheric temperature
luminosity_w = 3.828e26             # zero derives it from the effective temperature

[luminosity]
model = "power_law"                 # fixed (constant; takes luminosity_w) | mass_to_luminosity (cuntz_wang) | power_law
power_law_coeff = 1.0               # L = L_sun coeff (M / M_sun)^exponent
power_law_exponent = 3.5

[tides]
global_tidal_model = "cpl"          # constant phase lag: k_l (1 - i / Q_l)
fixed_k = [0.03, 0.01]
fixed_q = [1.0e6, 1.0e6]
min_degree_l = 2
max_degree_l = 3
eccentricity_trunc_lvl = 2
obliquity_trunc_lvl = "off"
