# Example-World: every key a layered world file can carry, in one buildable file. It is not a real body; the values
# only need to build, solve, and run tides. The bundled worlds are the terse, fitted versions, and
# Documentation/Structures/config/toml_schema.md is the schema this file walks through.
#
# Layers go inner to outer. A layer's material is a MatPack name, a preset with overrides, or a full table (all three
# appear below); a layer naming none takes [layers] material of TidalPy_Configs.toml. Omitted values take defaults.

schema_version = "0.2.0"            # a minor mismatch warns, a major one refuses
name = "Example-World"
type = "terrestrial"                # star | gasgiant | terrestrial | layered
radius_m = 2.0e6
mass_kg = 1.2945e23
albedo = 0.25                       # Bond albedo, for insolation from a System
emissivity = 0.95                   # infrared emissivity
obliquity_rad = 0.02                # spin-axis tilt to the orbit normal
spin_frequency_rad_s = 1.5e-5       # a System can set it synchronous
moment_of_inertia_factor = 0.36     # C / (M R^2), used until the equation of state is solved

# This world's solver settings: they win over TidalPy_Configs.toml, and a call's own argument wins over both.
[eos_solver]
integration_method = "DOP853"       # DOP853 | RK45 | RK23 | Tsit5 | Vern7 | Vern8 | BDF | LSODA | Radau
rtol = 1.0e-10
atol = 1.0e-14
pressure_tol = 1.0e-8               # surface-pressure mismatch that ends the central-pressure iteration
max_iters = 100
slices_per_layer = 100              # radial samples per layer in the stored profile
nondimensionalize = true
solve_temperature = true            # carry temperature and heat flow through the structure solve
max_thermal_passes = 12             # cap on the thermal relaxation passes
thermal_tol = 1.0e-8                # relative change in interface temperatures and flows that ends them

[radial_solver]
integration_method = "DOP853"
rtol = 1.0e-6
atol = 1.0e-10
starting_method = "takeuchi"        # takeuchi | kamata | power_series | unity
degree1_frame = "CE"                # frame of degree-1 load Love numbers: CE | CM | CF | CL | CH
start_radius_tolerance = 1.0e-5     # the automatic starting radius is R * start_radius_tolerance^(1/l)
scale_rtols = false                 # experimental
max_num_steps = 500000
expected_size = 1000
max_ram_mb = 500
nondimensionalize = true

# Global (1D) tidal dissipation.
[tides]
global_tidal_model = "rheology"     # rheology (radial solver Love numbers) | cpl | ctl | ctl_q (analytic)
min_degree_l = 2
max_degree_l = 3
eccentricity_trunc_lvl = 10         # 2 | 4 | 6 | 8 | 10 | 20 | 50 | "exact"; others promote with a warning
eccentricity_exact_tolerance = 1.0e-4   # heating tail fraction of "exact"
obliquity_trunc_lvl = 2             # "off" | 2 | 4 | "gen" (the general form)
layer_tidal_heating = true          # also resolve each layer's heating (radial solver Love numbers only)
love_method = "radial_solver"       # radial_solver | propagation_matrix | homogeneous | cpl | ctl
love_fixed_q = 100.0                # Q of the cpl Love method
love_fixed_dt_s = 600.0             # time lag [s] of the ctl Love method

# Layer 1, innermost (inner radius 0): every scalar key a layer takes. Its material is a MatPack preset plus the
# bulk viscosity its bulk rheology needs.
[layers.inner_core]
layer_index = 0                     # optional when the tables are in order
radius_outer_m = 6.0e5              # or radius_fraction | volume_fraction
mass_kg = 6.9e21                    # optional; each equation-of-state solve overwrites it
use_tides = true                    # off: the layer gets no tidal heating
tidal_scale = 0.001                 # share in the quasi-homogeneous Love methods; default: its volume fraction
is_volume_fixed = true              # false: the layer moves its radii to hold its mass
state = "auto"                      # auto (from the material) | solid | liquid
is_static = true                    # false: the dynamic (inertial) form, which liquids need
is_incompressible = false           # a static incompressible solid has no shooting start
temperature_k = 1900.0
use_thermal_expansion = false       # density follows temperature
use_melting = false                 # melt phase, melt fraction, and weakening
use_pressure_melting = false        # melting curves follow pressure
use_melt_density = false            # mix the melt density in by volume
use_heating = false                 # the world's heat sources act here in a thermal solve

[layers.inner_core.material]
preset = "simple_iron_core"         # see TidalPy.Material.available_materials()

[layers.inner_core.material.solid.bulk_viscosity]
model = "constant"                  # constant | reference | arrhenius | composite | interpolate
reference_viscosity_pas = 1.0e22

# A layer's own rheology wins over its material's.
[layers.inner_core.shear_rheology]
model = "maxwell"                   # elastic (off) | viscous (newton) | voigt | maxwell | burgers | andrade |
                                    # sundberg | zener (sls) | seismic_q

[layers.inner_core.bulk_rheology]
model = "burgers"
voigt_modulus_frac = 0.2
voigt_viscosity_frac = 0.02

# Layer 2: a static liquid core from a liquid-only MatPack material, with cooling and radiogenics off. Its outer
# radius is set by volume fraction.
[layers.outer_core]
layer_index = 1
volume_fraction = 0.06
use_tides = false                   # a liquid dissipates nothing in this model
temperature_k = 1800.0
material = "simple_liquid_iron"     # a MatPack name, or a table

[layers.outer_core.cooling]
model = "off"                       # off | convection | conduction

[layers.outer_core.radiogenics]
model = "off"                       # off | isotope | fixed (constant)

# Layer 3: a full material table (a Vinet solid, a melt phase, and the melting and mixing laws), holding its mass,
# conducting heat, with an inline isotope table.
[layers.lower_mantle]
layer_index = 2
radius_fraction = 0.75
use_tides = true
is_volume_fixed = false             # later solves move its radii to keep the first solve's mass
temperature_k = 1600.0              # below the solidus, so the layer stays solid
use_thermal_expansion = true
use_melting = true
use_pressure_melting = true
use_melt_density = true
use_heating = true

[layers.lower_mantle.material]
latent_heat_j_kg = 4.0e5            # spread over the melting range as an effective heat capacity

[layers.lower_mantle.material.solid]
thermal_conductivity_w_mk = 4.0
heat_capacity_j_kgk = 1200.0
conductivity_temperature_exponent = -0.5    # k = k0 (T / T_ref)^n and c_p = c_p0 (T / T_ref)^m
heat_capacity_temperature_exponent = 0.1
thermal_reference_temperature_k = 1600.0

[layers.lower_mantle.material.solid.eos]
model = "vinet"                     # constant | birch_murnaghan (bm) | vinet | murnaghan | polytrope |
                                    # modified_polytrope | interpolate
reference_density_kg_m3 = 3900.0
reference_bulk_modulus_pa = 2.0e11
bulk_modulus_derivative = 4.0
invert_rtol = 1.0e-10               # density inversion tolerance and cap (absent: [numerical] eos_invert_*)
invert_max_iters = 50
thermal_expansion_1_k = 2.5e-5      # alpha0; alpha = alpha0 K0 / K_T falls with compression
gruneisen_parameter = 1.2           # tidal bulk modulus K_S = K_T (1 + alpha gamma T)
reference_temperature_k = 300.0

[layers.lower_mantle.material.solid.shear_modulus]
model = "linear"                    # mu = mu0 + mu_P (P - P_ref) + mu_T (T - T_ref) | constant | interpolate
shear_modulus_pa = 1.2e11
pressure_derivative = 1.5
reference_pressure_pa = 0.0
temperature_derivative_pa_k = -1.0e7
reference_temperature_k = 300.0

[layers.lower_mantle.material.solid.shear_viscosity]
model = "arrhenius"                 # eta = A exp[(E + P V) / (R T)] times the stress and grain-size factors
arrhenius_coeff = 1.0e9             # units depend on the exponents
molar_activation_energy_j_mol = 3.0e5
molar_activation_volume_m3_mol = 4.0e-6
stress_pa = 1.0e5
stress_expo = 1.0
grain_size_m = 1.0e-3
grain_size_expo = 2.0
additional_temp_dependence = false  # multiply by T (the Goldsby and Kohlstedt form)

[layers.lower_mantle.material.solid.bulk_viscosity]
model = "reference"                 # eta = eta_ref exp[(E/R)(1/T - 1/T_ref) + (V/R)(P/T - P_ref/T_ref)]
reference_viscosity_pas = 1.0e23
reference_temperature_k = 1600.0
molar_activation_energy_j_mol = 3.0e5
molar_activation_volume_m3_mol = 0.0
reference_pressure_pa = 0.0         # deep laws are better anchored inside the layer

[layers.lower_mantle.material.liquid.eos]
model = "birch_murnaghan"           # a compressible melt, so a thermal solid cannot come out lighter than it
reference_density_kg_m3 = 2750.0
reference_bulk_modulus_pa = 2.0e10
bulk_modulus_derivative = 5.0

[layers.lower_mantle.material.liquid.shear_viscosity]
model = "constant"
reference_viscosity_pas = 0.2

[layers.lower_mantle.material.melting.solidus]
model = "simon_glatzel_2"           # constant | simon_glatzel | simon_glatzel_2 | interpolate
temperature_k = 1661.2              # T0 (1 + P / a)^(1 / c), a second law above the transition pressure; fits of
simon_a_pa = 1.336e9                # Monteux et al. (2016) to Andrault et al. (2011) and Fiquet et al. (2010)
simon_c = 7.437
reference_pressure_pa = 0.0         # where each T0 applies; a negative a makes a curve fall with pressure
transition_pressure_pa = 2.0e10
high_temperature_k = 2081.8
high_simon_a_pa = 1.0169e11
high_simon_c = 1.226
high_reference_pressure_pa = 0.0

[layers.lower_mantle.material.melting.liquidus]
model = "simon_glatzel_2"
temperature_k = 1982.1
simon_a_pa = 6.594e9
simon_c = 5.374
transition_pressure_pa = 2.0e10
high_temperature_k = 78.74
high_simon_a_pa = 4.054e6
high_simon_c = 2.44

[layers.lower_mantle.material.melting.weakening]
model = "spohn"                     # spohn (Fischer and Spohn 1990 power law) | none | henning
fs_visc_power_slope_k = 27000.0     # viscosity and shear-modulus power laws: slope, and log10 at the solidus
fs_visc_log10_at_solidus = 15.875   # (absent: the solid's own value at the solidus)
fs_shear_power_slope_k = 82000.0
fs_shear_log10_at_solidus = 10.65
crit_melt_frac = 0.5                # the band where the aggregate blends into the liquid
crit_melt_frac_width = 0.05

[layers.lower_mantle.material.melting.bulk_modulus_mixing]
model = "hashin_shtrikman"          # melt weakens the bulk modulus (absent: the solid's)

[layers.lower_mantle.material.melting.bulk_viscosity_mixing]
model = "compaction"                # c eta / phi^n (McKenzie 1984 at n = 1)
coefficient = 1.0
exponent = 1.0

[layers.lower_mantle.shear_rheology]
model = "sundberg"                  # Andrade transient plus a Voigt element
alpha = 0.33                        # Andrade exponent (andrade, sundberg)
zeta = 1.0                          # Andrade timescale ratio (andrade, sundberg)
voigt_modulus_frac = 0.2            # Voigt element as fractions of the layer's (voigt, burgers, sundberg)
voigt_viscosity_frac = 0.02

[layers.lower_mantle.bulk_rheology]
model = "voigt"
voigt_modulus_frac = 0.5
voigt_viscosity_frac = 0.1

[layers.lower_mantle.cooling]
model = "conduction"                # reads the material's thermal constants

[layers.lower_mantle.radiogenics]
model = "isotope"                   # isotopes given inline here, by dataset name in the next layer
heat_production_w_kg = [9.46e-5, 5.69e-4, 2.64e-5, 2.92e-5]   # per isotope: U238, U235, Th232, K40
half_lives_s = [1.409e17, 2.221e16, 4.434e17, 3.938e16]
mass_fracs = [0.9928, 0.0072, 1.0, 1.17e-4]                     # of the element
concentrations = [2.0e-8, 2.0e-8, 8.0e-8, 2.4e-4]                # of the element in the rock, by mass
isotope_names = ["U238", "U235", "Th232", "K40"]
ref_time_s = 1.4516496e17           # when the concentrations hold (4.6 Gyr)

# Layer 4: dynamic MatPack peridotite with its viscosity replaced (a preset's tables merge under the layer's own).
# It convects and uses a named isotope dataset.
[layers.upper_mantle]
layer_index = 3
radius_outer_m = 1.95e6
use_tides = true
is_static = false                   # dynamic form (inertia kept)
temperature_k = 1600.0
use_heating = true

[layers.upper_mantle.material]
preset = "peridotite"

[layers.upper_mantle.material.solid.shear_viscosity]
model = "reference"                 # replaces the preset's composite law
reference_viscosity_pas = 1.0e20
reference_temperature_k = 1600.0
molar_activation_energy_j_mol = 3.0e5
molar_activation_volume_m3_mol = 0.0

[layers.upper_mantle.material.solid.bulk_viscosity]
model = "composite"                 # mechanisms in parallel: 1 / eta = sum of 1 / eta_i
mechanisms = [{ model = "constant", reference_viscosity_pas = 1.0e22 }]

[layers.upper_mantle.shear_rheology]
model = "andrade"
alpha = 0.3
zeta = 1.0

[layers.upper_mantle.bulk_rheology]
model = "zener"                     # standard linear solid: relaxes to a finite modulus, unlike maxwell
relaxed_modulus_frac = 0.9          # of the unrelaxed modulus (zener)

[layers.upper_mantle.cooling]
model = "convection"                # boundary-layer convection from a Nusselt-Rayleigh law
convection_alpha = 1.0              # solid interior: Nu = alpha (Ra / Ra_crit)^beta
convection_beta = 0.3333333333333333
critical_rayleigh = 1100.0
liquid_convection_alpha = 0.089     # liquid interior: Nu = alpha Ra^beta (Solomatov 2000)
liquid_convection_beta = 0.3333333333333333
viscosity_depth_fraction = 0.05     # interior viscosity is the log-mean over the top 5% of the layer

[layers.upper_mantle.radiogenics]
model = "isotope"
isotopes = "modern_day_chondritic"  # modern_day_chondritic | llri | slri | llri_and_slri | bulk_silicate_earth

# Layer 5: a radius-tabulated material given inline, the form every layer of a data-file world takes; past the last
# radius the last value holds. Viscous, so rigid at tidal periods; a layer with no rheology at all is elastic.
[layers.crust]
layer_index = 4
radius_fraction = 1.0
use_tides = false
temperature_k = 300.0

[layers.crust.material.solid.eos]
model = "interpolate"
radius_m = [1.95e6, 1.975e6, 2.0e6]
density_kg_m3 = [2900.0, 2800.0, 2700.0]
bulk_modulus_pa = [7.5e10, 7.0e10, 6.5e10]

[layers.crust.material.solid.shear_modulus]
model = "interpolate"
radius_m = [1.95e6, 1.975e6, 2.0e6]
shear_modulus_pa = [4.0e10, 3.5e10, 3.0e10]

[layers.crust.material.solid.shear_viscosity]
model = "interpolate"               # optional; without it the crust cannot relax
radius_m = [1.95e6, 1.975e6, 2.0e6]
viscosity_pas = [1.0e24, 1.0e24, 1.0e24]

[layers.crust.material.solid.bulk_viscosity]
model = "interpolate"
radius_m = [1.95e6, 1.975e6, 2.0e6]
viscosity_pas = [1.0e25, 1.0e25, 1.0e25]

[layers.crust.shear_rheology]
model = "viscous"                   # mu* = i omega eta
