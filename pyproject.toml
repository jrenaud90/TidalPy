[project]
name='TidalPy'
version = '0.8.0a1.dev2'
description='Tidal Dynamics and Thermal-Orbital Evolution Software Suite Implemented in Cython and Python'
authors= [ 
    {name = 'Joe P. Renaud', email = 'TidalPy@gmail.com'}
    ]
requires-python = ">=3.9,<3.15"
dependencies = [
    # Scientific and computing resources
    "numba>=0.54.1",
    'numpy >= 1.22, <2.6',
    "scipy>=1.9.3",
    # Plotting
    "matplotlib>=3.4.2",
    # Configuration file resources
    "platformdirs>=3.11.0",
    "toml>=0.10.2",
    # Additional multiprocessing support resources
    "dill>=0.3.2",
    "psutil>=5.8.0",
    "pathos>=0.2.0",
    # Install CyRK requirements
    "cyrk>=0.19.0,<0.20.0",
    # Exoplanet data archive
    "astropy",
    "astroquery"
]
license = "Apache-2.0"
license-files = ["LICEN[CS]E*"]
readme = "README.md"
keywords = [
    "Scientific Computing",
    "Scientific Modeling",
    "Astrophysics",
    "Astronomy",
    "Planets",
    "Moons",
    "Exoplanets",
    "Planetary Science",
    "Planetary Interiors",
    "Orbital Dynamics",
    "Tides",
    "Tidal Dynamics",
    "Tidal Heating",
    "Numerical Integration"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Cython",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Natural Language :: English",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
    "Natural Language :: English"
]

[project.urls]
"Homepage" = "https://github.com/jrenaud90/TidalPy"
"Bug Tracker" = "https://github.com/jrenaud90/TidalPy/issues"
"Documentation" = "https://tidalpy.readthedocs.io/en/latest/"

[project.optional-dependencies]
dev = [
    "jupyter",
    "pytest",
    "pandas>=1.5",
    "cmcrameri>=1.4, <2.0",
    "palettable>=3.3.0",
    "ipympl>=0.8.7",
]

docs = [
    "sphinx",
    "myst-parser",
    "linkify-it-py",
    "sphinx_rtd_theme",
    "toml",
    "sphinx-copybutton",
    "nbsphinx",
    "ipykernel",
    "nbconvert",
    "jupyter",
    "sphinx-autodoc-typehints",
    "breathe"
]

# Recommended (sometimes required) graphics packages
graphics = [
    "jupyter",
    "cmcrameri>=1.4,<2.0",
    "palettable>=3.3.0",
    "ipympl>=0.8.7",
    "cartopy>=0.22.0"
]

# Extending installs
burnman = [
    "autograd",
    "burnman>=2.1.0, <3"
]

julia = [
    "julia>=0.5.7",
    "diffeqpy>=1.2.0"
]

# The extension modules are declared in setup.py (setuptools has no pyproject.toml equivalent for them).
[build-system]
requires = [
    'setuptools>=64.0.0',
    'numpy >= 1.22, <2.6',
    "scipy>=1.9.3",
    'cython>=3.0.0',
    'wheel>=0.38',
    "cyrk>=0.19.0,<0.20.0"
]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["TidalPy*"]
exclude = [
    "Tests*",
    "Docs*",
    "Other*",
    ".vscode",
    ".idea",
    ".github",
    "Papers*",
    "Demos*",
    "Benchmarks*",
    "Documentation*"
]

# TODO: Get rid of the below once the numba-scipy package is updated. See the note in the module's folder.
[project.entry-points.numba_extensions]
init = "TidalPy.numba_scipy:_init_extension"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -v"
testpaths = [
    "Tests"
]

# Binary wheel builds (see .github/workflows/build_wheels_main_pypi.yml). Each wheel is built, repaired (auditwheel,
# delvewheel, or delocate bundle any non-system libraries it links to), and then tested in a fresh environment.
[tool.cibuildwheel]
build = "*"
# No PyPy or musl wheels. Free-threaded CPython (the "t" builds) is skipped because numba, a hard dependency, does
# not ship free-threaded wheels.
skip = ["pp*", "*musl*", "cp3??t-*"]
# Having issues with SciPy install during wheel build on 32-bit systems.
archs = ["auto64"]
# Import the installed wheel, including the compiled RadialSolver modules that failed to load from the v0.7.4 macOS
# wheels.
test-command = 'python -c "import TidalPy; from TidalPy.RadialSolver import radial_solver, build_rs_input_homogeneous_layers; from TidalPy.rheology import Maxwell; from TidalPy.structures import build_world; print(TidalPy.__version__)"'

[tool.cibuildwheel.macos]
# The oldest macOS supported by numba's and scipy's arm64 wheels; also what the previous TidalPy wheels targeted.
environment = { MACOSX_DEPLOYMENT_TARGET = "12.0" }
