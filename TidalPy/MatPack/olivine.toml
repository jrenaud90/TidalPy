# olivine: mantle olivine Fo90.
# Solid: Birch-Murnaghan and shear modulus from Stixrude and Lithgow-Bertelloni (2011), Table A1 (Fo90 density,
# expansivity, and temperature derivative derived with BurnMan); valid to about 14 GPa (wadsleyite above). Gruneisen
# parameter: forsterite's.
# Conductivity: Xu et al. (2004) at 1600 K, without its pressure factor (1 + 0.032 P[GPa]). Heat capacity: power law
# through the derived 300 and 1600 K values.
# Viscosity: dry olivine diffusion and dislocation creep in parallel, as peridotite. Tidal rheology: Sundberg-Cooper
# (Sundberg and Cooper 2010; Renaud and Henning 2018).
# Melting: congruent melting of forsterite (Presnall and Walter 1993), valid to 10.1 GPa; latent heat of forsterite
# (Richet et al. 1993). Fo90 really melts over an interval; for natural olivine the peridotite curves are usually
# better. Liquid: the peridotite melt.
schema_version = "0.2.0"
description = "Mantle olivine (Fo90) with a forsterite melting curve and the peridotite melt."
category = "rocky"
latent_heat_j_kg = 1.0e6

[solid]
thermal_conductivity_w_mk = 1.78
conductivity_temperature_exponent = -0.5
heat_capacity_j_kgk = 1263.0
heat_capacity_temperature_exponent = 0.226
thermal_reference_temperature_k = 1600.0

[solid.eos]
model = "birch_murnaghan"
reference_density_kg_m3 = 3351.0
reference_bulk_modulus_pa = 1.287e11
bulk_modulus_derivative = 4.22
thermal_expansion_1_k = 2.24e-5
reference_temperature_k = 300.0
gruneisen_parameter = 0.99

[solid.shear_modulus]
model = "linear"
shear_modulus_pa = 7.7e10
pressure_derivative = 1.44
temperature_derivative_pa_k = -1.31e7
reference_temperature_k = 300.0

[solid.shear_viscosity]
model = "composite"

# Diffusion creep (Hirth and Kohlstedt 2003, Table 1).
[[solid.shear_viscosity.mechanisms]]
model = "arrhenius"
arrhenius_coeff = 3.33e14
stress_pa = 1.0e5
stress_expo = 1.0
grain_size_m = 1.0e-3
grain_size_expo = 3.0
molar_activation_energy_j_mol = 3.75e5
molar_activation_volume_m3_mol = 6.0e-6

# Dislocation creep (Hirth and Kohlstedt 2003, Table 1; activation volume from Dixon and Durham 2018).
[[solid.shear_viscosity.mechanisms]]
model = "arrhenius"
arrhenius_coeff = 4.55e15
stress_pa = 1.0e5
stress_expo = 3.5
grain_size_m = 1.0e-3
grain_size_expo = 0.0
molar_activation_energy_j_mol = 5.3e5
molar_activation_volume_m3_mol = 1.5e-5

[solid.shear_rheology]
model = "sundberg"
alpha = 0.3
zeta = 1.0
voigt_modulus_frac = 5.0
voigt_viscosity_frac = 0.02

[liquid]
preset = "peridotite"

[melting.solidus]
model = "simon_glatzel"
temperature_k = 2171.0
simon_a_pa = 2.44e9
simon_c = 11.4

[melting.liquidus]
model = "simon_glatzel"
temperature_k = 2171.0
simon_a_pa = 2.44e9
simon_c = 11.4
