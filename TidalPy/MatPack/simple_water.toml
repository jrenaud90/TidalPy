# simple_water: uniform liquid water ocean.
#
# A liquid-only material: constant density and bulk modulus, no shear modulus, and a constant viscosity.
#
# References: rounds IAPWS liquid water near 273 K (999.8 kg m-3; K_S 2.2 GPa at modest pressure; 1.8e-3 Pa s;
# Patek et al. 2009; Huber et al. 2009, 2012). The expansivity is the value near 50 MPa, positive like a pressurized
# ocean's (IAPWS G12-15).
schema_version = "0.2.0"
description = "Uniform liquid water: constant density and bulk modulus; always liquid."
category = "simplified"

[liquid]
thermal_conductivity_w_mk = 0.56
heat_capacity_j_kgk = 4200.0

[liquid.eos]
model = "constant"
reference_density_kg_m3 = 1000.0
bulk_modulus_pa = 2.2e9
thermal_expansion_1_k = 1.0e-4
reference_temperature_k = 273.15

[liquid.shear_viscosity]
model = "constant"
reference_viscosity_pas = 1.8e-3
