# chondrite: ordinary-chondrite rock at zero porosity (olivine Fo80 0.45, orthopyroxene 0.27, plagioclase 0.10,
# clinopyroxene 0.05, Fe metal 0.08 by volume; troilite omitted). Porous chondrites need a separate treatment.
# Solid: Birch-Murnaghan (fit 0 to 10 GPa), expansivity, and shear modulus derived from the Stixrude and
# Lithgow-Bertelloni (2011) end-members and hcp iron (Kurnosov et al. 2017) with BurnMan; density as H chondrite grains
# (Consolmagno et al. 2008). Gruneisen parameter: forsterite's.
# Conductivity and heat capacity: Hevey and Sanders (2006). Viscosity: peridotite's diffusion law (unsourced choice).
# Melting: silicate solidus and liquidus of Ghosh and McSween (1998) and Hevey and Sanders (2006); the Fe-FeS eutectic
# (1261 K), where the first melt appears, is not represented. Liquid: the peridotite melt.
schema_version = "0.2.0"
description = "Undifferentiated chondritic rock (zero porosity) with constant silicate melting temperatures."
category = "rocky"
latent_heat_j_kg = 4.0e5

[solid]
thermal_conductivity_w_mk = 2.1
heat_capacity_j_kgk = 837.0

[solid.eos]
model = "birch_murnaghan"
reference_density_kg_m3 = 3750.0
reference_bulk_modulus_pa = 1.11e11
bulk_modulus_derivative = 5.2
thermal_expansion_1_k = 2.3e-5
reference_temperature_k = 300.0
gruneisen_parameter = 0.99

[solid.shear_modulus]
model = "linear"
shear_modulus_pa = 6.7e10
pressure_derivative = 1.52
temperature_derivative_pa_k = -1.31e7
reference_temperature_k = 300.0

# Dry olivine diffusion creep (Hirth and Kohlstedt 2003).
[solid.shear_viscosity]
model = "arrhenius"
arrhenius_coeff = 3.33e14
stress_pa = 1.0e5
stress_expo = 1.0
grain_size_m = 1.0e-3
grain_size_expo = 3.0
molar_activation_energy_j_mol = 3.75e5
molar_activation_volume_m3_mol = 6.0e-6

[solid.shear_rheology]
model = "andrade"
alpha = 0.3
zeta = 1.0

[liquid]
preset = "peridotite"

[melting.solidus]
model = "constant"
temperature_k = 1425.0

[melting.liquidus]
model = "constant"
temperature_k = 1850.0

[melting.weakening]
model = "henning"
