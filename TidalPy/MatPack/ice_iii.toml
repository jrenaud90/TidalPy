# ice_iii: water ice III (about 0.21 to 0.35 GPa), melting into liquid water.
#
# Solid: the bulk modulus and K0' of the cold-curve Birch-Murnaghan parameters of Journaux et al. (2020), Table 3. Their
# cold reference density (1163.5 kg m-3) gives about 1190 kg m-3 at 0.25 GPa, so it is rescaled here to 1133 kg m-3,
# which gives the 1160 kg m-3 at 0.25 GPa and 250 K where the shear modulus is anchored (derived here). The
# expansivity (1e-4 to 2e-4 K-1) is an unsourced estimate. The shear modulus is the SeaFreeze law for ices III, V,
# and VI (Journaux et al. 2020) at 1160 kg m-3 and 250 K.
#
# Viscosity: an unsourced reference-law placeholder; ice III is the weakest ice phase (Durham et al. 1997, 2010).
# Conductivity: lower than ice Ih (Ahrens et al. 2022), unsourced. Heat capacity and latent heat (2.8e5 to 3.8e5 J
# kg-1 by Clausius-Clapeyron) are estimates. Confidence low.
#
# Melting: the IAPWS R14-08 (2011) ice III curve, in the form anchored at its triple point (251.165 K, 208.566 MPa).
# Liquid: water.
schema_version = "0.2.0"
description = "Water ice III with the IAPWS melting curve, melting into liquid water."
category = "icy"
latent_heat_j_kg = 3.3e5

[solid]
thermal_conductivity_w_mk = 1.3
heat_capacity_j_kgk = 2000.0

[solid.eos]
model = "birch_murnaghan"
reference_density_kg_m3 = 1133.0
reference_bulk_modulus_pa = 9.9e9
bulk_modulus_derivative = 6.0
thermal_expansion_1_k = 1.5e-4
reference_temperature_k = 250.0

[solid.shear_modulus]
model = "linear"
shear_modulus_pa = 3.9e9
pressure_derivative = 1.8
temperature_derivative_pa_k = -1.4e7
reference_pressure_pa = 2.5e8
reference_temperature_k = 250.0

[solid.shear_viscosity]
model = "reference"
reference_viscosity_pas = 1.0e14
reference_temperature_k = 250.0
molar_activation_energy_j_mol = 1.1e5

[solid.shear_rheology]
model = "andrade"
alpha = 0.3
zeta = 1.0

[liquid]
preset = "water"

[melting.solidus]
model = "simon_glatzel"
temperature_k = 251.165
reference_pressure_pa = 2.08566e8
simon_a_pa = 6.256e7
simon_c = 60.0

[melting.liquidus]
model = "simon_glatzel"
temperature_k = 251.165
reference_pressure_pa = 2.08566e8
simon_a_pa = 6.256e7
simon_c = 60.0
