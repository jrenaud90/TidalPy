# ice_ih: water ice Ih, melting into liquid water.
# Solid: Birch-Murnaghan at 250 K from IAPWS-06 (Feistel and Wagner 2006; K0' derived over 0 to 200 MPa); ice III takes
# over above about 210 MPa. Expansivity: the 250 K value (it varies from 3.0e-5 to 1.6e-4 K-1 with temperature, which no
# law here represents). Gruneisen parameter: IAPWS-06 at 250 K, so a tide sees K_S (1.03 K_T near melting).
# Temperature dependence of the moduli: Neumeier (2018, J. Phys. Chem. Ref. Data 47, 033101), Table 1, polycrystalline
# ice from 50 to 270 K. dK/dT fits his adiabatic bulk modulus (within 2.2 percent); the shear modulus is a linear fit to
# his Hill shear modulus (within 0.08 GPa), with the pressure derivative of SeaFreeze ice Ih (Journaux et al. 2020).
# Poisson's ratio stays at 0.326 to 0.334 from the melting point to 50 K (measured 0.325 to 0.336; Gammon et al. 1983
# also find all elastic constants scaling together). Below 50 K the moduli are extrapolated.
# Conductivity: power law through Petrenko and Whitworth (1999). Heat capacity: power law fit to IAPWS-06 from 100 to
# 273 K.
# Viscosity: volume-diffusion creep (Goldsby and Kohlstedt 2001) at a 0.5 mm grain size; their basal-slip,
# grain-boundary-sliding, and dislocation mechanisms are not included.
# Melting: a fit to the IAPWS R14-08 (2011) ice Ih curve (maximum error 0.17 K), held at about 251 K above the
# 208.566 MPa triple point, where ice III takes over. Latent heat: IAPWS. Liquid: water.
schema_version = "0.2.0"
description = "Water ice Ih (IAPWS-06) with diffusion creep, melting into liquid water."
category = "icy"
latent_heat_j_kg = 3.334e5

[solid]
thermal_conductivity_w_mk = 2.43
conductivity_temperature_exponent = -0.84
heat_capacity_j_kgk = 1927.0
heat_capacity_temperature_exponent = 0.87
thermal_reference_temperature_k = 250.0

[solid.eos]
model = "birch_murnaghan"
reference_density_kg_m3 = 920.0
reference_bulk_modulus_pa = 8.79e9
bulk_modulus_derivative = 5.4
thermal_expansion_1_k = 1.48e-4
reference_temperature_k = 250.0
gruneisen_parameter = 0.75
bulk_modulus_temperature_derivative_pa_k = -1.11e7

[solid.shear_modulus]
model = "linear"
shear_modulus_pa = 3.54e9
pressure_derivative = -0.48
temperature_derivative_pa_k = -2.94e6
reference_temperature_k = 250.0

# Volume diffusion: eta = A T d^2 exp(E / (R T)), A = R / (42 V_m D0v).
[solid.shear_viscosity]
model = "arrhenius"
arrhenius_coeff = 1.104e7
additional_temp_dependence = true
stress_pa = 1.0
stress_expo = 1.0
grain_size_m = 5.0e-4
grain_size_expo = 2.0
molar_activation_energy_j_mol = 5.94e4
molar_activation_volume_m3_mol = 0.0

[solid.shear_rheology]
model = "andrade"
alpha = 0.3
zeta = 1.0

[liquid]
preset = "water"

[melting.solidus]
model = "simon_glatzel"
temperature_k = 273.16
simon_a_pa = -4.15e8
simon_c = 8.25
maximum_pressure_pa = 2.08566e8

[melting.liquidus]
model = "simon_glatzel"
temperature_k = 273.16
simon_a_pa = -4.15e8
simon_c = 8.25
maximum_pressure_pa = 2.08566e8
