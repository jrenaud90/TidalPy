# h_he_metallic: the metallic hydrogen-helium envelope of a Jupiter-like planet; liquid only.
# Same n = 1 polytrope as h2_he_molecular (Hubbard 1984), so there is no density step between them; the split only
# labels the layers.
# Temperatures 6000 to 20000 K (French et al. 2012; Guillot 2005). Conductivity, heat capacity, expansivity, and
# viscosity: French et al. (2012).
schema_version = "0.2.0"
description = "Metallic H-He envelope on Jupiter's n = 1 polytrope; always fluid."
category = "giant"

[liquid]
thermal_conductivity_w_mk = 1.0e3
heat_capacity_j_kgk = 1.35e4

[liquid.eos]
model = "polytrope"
polytropic_constant = 2.08e5
polytropic_index = 1.0
thermal_expansion_1_k = 3.0e-5
reference_temperature_k = 6000.0

[liquid.shear_viscosity]
model = "constant"
reference_viscosity_pas = 3.0e-4
