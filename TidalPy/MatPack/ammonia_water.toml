# ammonia_water: water ice with 10 wt% NH3 melting into an ammonia-water liquid (low confidence).
# Solid: ice_ih; the ammonia dihydrate below the peritectic is not represented.
# Solidus: the 176.15 K peritectic (Kargel 1992; Leliwa-Kopystynski et al. 2002). Liquidus: about 258 K, unsourced.
# Liquid: the 10 wt% melt at 258 K, density and viscosity from Hammond et al. (2018) Eqs. 12 and 13; bulk modulus and
# expansivity are unsourced estimates near water's. Latent heat: ice Ih's.
# Henning weakening by melt fraction only: its temperature term (hn_shear_param_1_k = 0) would soften the ice to about
# 1e-2 Pa within 25 K of the solidus.
schema_version = "0.2.0"
description = "Water ice with 10 wt% NH3 and an ammonia-water melt below the water melting point (low confidence)."
category = "icy"
preset = "ice_ih"
latent_heat_j_kg = 3.3e5

[liquid]
thermal_conductivity_w_mk = 0.5
heat_capacity_j_kgk = 4000.0

[liquid.eos]
model = "constant"
reference_density_kg_m3 = 977.0
bulk_modulus_pa = 2.0e9
thermal_expansion_1_k = 1.0e-4
reference_temperature_k = 258.0

[liquid.shear_viscosity]
model = "constant"
reference_viscosity_pas = 1.7e-3

[melting.solidus]
model = "constant"
temperature_k = 176.15

[melting.liquidus]
model = "constant"
temperature_k = 258.0

[melting.weakening]
model = "henning"
hn_shear_param_1_k = 0.0
