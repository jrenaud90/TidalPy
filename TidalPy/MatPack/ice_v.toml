# ice_v: water ice V (about 0.35 to 0.63 GPa), melting into liquid water (low confidence).
# Solid: bulk modulus and K0' of the Journaux et al. (2020), Table 3 cold curve, with the reference density rescaled
# (derived here) to 1235 kg m-3 at 0.5 GPa. Expansivity: unsourced estimate. Shear modulus: SeaFreeze law (Journaux
# et al. 2020) at 1235 kg m-3 and 260 K.
# Viscosity: unsourced placeholder (melting-point viscosities of 1e13 to 1e17 Pa s are used for high-pressure ices;
# Choblet et al. 2017; Kalousova et al. 2018). Conductivity, heat capacity, and latent heat: unsourced.
# Melting: IAPWS R14-08 (2011) ice V curve, anchored at its triple point (256.164 K, 350.1 MPa). Liquid: water.
schema_version = "0.2.0"
description = "Water ice V with the IAPWS melting curve, melting into liquid water."
category = "icy"
latent_heat_j_kg = 3.0e5

[solid]
thermal_conductivity_w_mk = 1.5
heat_capacity_j_kgk = 2100.0

[solid.eos]
model = "birch_murnaghan"
reference_density_kg_m3 = 1193.5
reference_bulk_modulus_pa = 1.32e10
bulk_modulus_derivative = 6.0
thermal_expansion_1_k = 1.0e-4
reference_temperature_k = 250.0

[solid.shear_modulus]
model = "linear"
shear_modulus_pa = 5.0e9
pressure_derivative = 1.3
temperature_derivative_pa_k = -1.4e7
reference_pressure_pa = 5.0e8
reference_temperature_k = 260.0

[solid.shear_viscosity]
model = "reference"
reference_viscosity_pas = 1.0e14
reference_temperature_k = 270.0
molar_activation_energy_j_mol = 1.1e5

[solid.shear_rheology]
model = "andrade"
alpha = 0.3
zeta = 1.0

[liquid]
preset = "water"

[melting.solidus]
model = "simon_glatzel"
temperature_k = 256.164
reference_pressure_pa = 3.501e8
simon_a_pa = 4.156e8
simon_c = 8.0

[melting.liquidus]
model = "simon_glatzel"
temperature_k = 256.164
reference_pressure_pa = 3.501e8
simon_a_pa = 4.156e8
simon_c = 8.0
