# simple_liquid_iron: uniform liquid iron-alloy core.
#
# A liquid-only material: constant density and bulk modulus, no shear modulus, and a constant viscosity.
#
# References: density and adiabatic bulk modulus round liquid iron at 1 bar (7019 kg m-3, K_S 110 GPa; Anderson and
# Ahrens 1994); viscosity near core conditions (de Wijs et al. 1998); expansivity and heat capacity derived from
# Anderson and Ahrens (1994).
schema_version = "0.2.0"
description = "Uniform liquid iron-alloy core: constant density and bulk modulus; always liquid."
category = "simplified"

[liquid]
thermal_conductivity_w_mk = 40.0
heat_capacity_j_kgk = 830.0

[liquid.eos]
model = "constant"
reference_density_kg_m3 = 7000.0
bulk_modulus_pa = 1.1e11
thermal_expansion_1_k = 9.0e-5
reference_temperature_k = 1811.0

[liquid.shear_viscosity]
model = "constant"
reference_viscosity_pas = 1.0e-2
