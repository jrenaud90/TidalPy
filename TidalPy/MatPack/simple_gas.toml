# simple_gas: uniform gas-giant envelope.
#
# A liquid-only placeholder for the bulk of a Jupiter-like envelope: constant density (about Jupiter's mean density,
# 1326 kg m-3) and an order-of-magnitude bulk modulus (an n = 1 polytrope has K = 2 P, so 1e11 Pa is P of about
# 0.5 Mbar). Use h2_he_molecular and h_he_metallic, polytropes, for anything physical. Confidence low.
#
# References: heat capacity, conductivity, and viscosity from the range of French et al. (2012) along the Jupiter
# adiabat. A constant density carries no thermal expansion here.
schema_version = "0.2.0"
description = "Uniform gas-giant envelope placeholder: constant density and bulk modulus; always fluid."
category = "simplified"

[liquid]
thermal_conductivity_w_mk = 10.0
heat_capacity_j_kgk = 1.4e4

[liquid.eos]
model = "constant"
reference_density_kg_m3 = 1300.0
bulk_modulus_pa = 1.0e11

[liquid.shear_viscosity]
model = "constant"
reference_viscosity_pas = 1.0e-3
