# Luna: the Moon as a four-layer body that matches observables, including its k2.
#
# Structure
# The core densities are the Apollo seismic reanalysis of Weber et al. (2011): 8000 kg/m3 for
# the solid inner core and 5100 kg/m3 for the fluid outer core, both incompressible because the lunar
# core's composition is the least constrained part of the model. Above them sit a silicate mantle and the
# low-density crust GRAIL measured, 34 to 43 km thick with a density near 2550 kg/m3 (Wieczorek et al. 2013).
#
# Three numbers are fitted, one per observable. The mantle's Birch-Murnaghan reference density, 3324.97
# kg/m3, reproduces the published mass. The crust thickness, 34 km, reproduces the moment-of-inertia
# factor: C/MR2 a Moon with no crust overshoots at 0.3965 against the measured 0.3931 +/- 0.0002
# (Williams et al. 2014). The core radius provides little change, moving C/MR2 only from 0.3968 to 0.3948
# across a 330 to 450 km core. The result is C/MR2 = 0.39312, a surface gravity of 1.6242 m/s2 against the
# observed 1.622, and a central pressure of 5.44 GPa.
#
# Tides
# The outer core is a static liquid. With it and the 6.0e10 Pa default mantle rigidity this interior gives
# k2 = 0.02526 at the monthly period, 4 percent above the measured 0.02422 +/- 0.00022 (Williams et al. 2014),
# so the mantle shear modulus is the third fitted number: 6.27e10 Pa gives 0.02421. The core is 4 percent of
# the volume, yet a solid outer core would move k2 to 0.02315, five times the measurement uncertainty.
#
# The dissipation is not calibrated. The mantle and crust are elastic at the temperature of the
# equation-of-state solve (their default viscosity is infinite there), so the only layer with a finite
# viscosity is the solid inner core, and k2/Q is near 3e-13 where lunar laser ranging measures 6.4e-4. Tidal
# heating from this file is therefore many orders of magnitude too low. Override the mantle viscosity and
# rheology to model the warm low-viscosity zone that the measured Q requires.
#
# Orbital state is not a world property in this schema; add Luna to a System to give it an orbit. The spin
# frequency is the synchronous rate from the classic file's 27.322 day spin period.
schema_version = "0.2.0"
name = "Luna"
type = "terrestrial"
radius_m = 1737400.0
mass_kg = 7.34579e22
spin_frequency_rad_s = 2.661667e-06
albedo = 0.12

[layers.inner_core]
class = "physics"
type = "iron"
layer_index = 0
radius_outer_m = 160000.0
is_tidal = false

[layers.inner_core.eos]
model = "constant"
reference_density_kg_m3 = 8000.0     # solid inner core, Weber et al. (2011)

[layers.outer_core]
class = "physics"
type = "iron"
layer_index = 1
radius_outer_m = 350000.0
is_tidal = false
is_solid = false                     # fluid outer core, solved as a static liquid

[layers.outer_core.eos]
model = "constant"
reference_density_kg_m3 = 5100.0     # fluid outer core, Weber et al. (2011)

[layers.mantle]
class = "solidliquid"
type = "mantle_rock"
layer_index = 2
radius_outer_m = 1703400.0
is_tidal = true
shear_modulus_static_pa = 6.27e10     # fitted to the measured k2 with the liquid outer core

[layers.mantle.eos]
model = "bm"
reference_density_kg_m3 = 3324.9726   # fitted to the published mass
reference_bulk_modulus_pa = 1.28e11   # forsterite-like
bulk_modulus_derivative = 4.2

[layers.crust]
class = "solidliquid"
type = "mantle_rock"
layer_index = 3
radius_fraction = 1.0
is_tidal = false
shear_modulus_static_pa = 4.0e10      # anorthositic crust, softer than the mantle's 6.0e10 Pa
bulk_modulus_static_pa = 7.5e10

[layers.crust.eos]
model = "constant"
reference_density_kg_m3 = 2550.0      # GRAIL crustal grain density
