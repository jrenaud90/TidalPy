# Triton: a rock core under a water-ice shell, on a retrograde synchronous orbit about Neptune.
#
# Rebuilt from the classic BurnMan-based WorldPack triton.toml, which supplied the core radius of 1064 km.
# Radius is 1352.6 km and the mass follows from GM = 1428.49546 km3/s2 (JPL satellite ephemeris NEP097),
# giving 2.1402926e22 kg and a mean density of 2065 kg/m3, the highest of any of the
# large icy moons after Europa and the reason Triton is usually read as a captured Kuiper belt object
# rather than a body formed in place.
#
# Structure
# The recipe is Pluto's and Charon's. Ice I is fixed at 917 kg/m3 and the rock core's Birch-Murnaghan
# reference density is fitted to the published mass, giving 3242.4854 kg/m3. That is denser than the
# roughly 3000 kg/m3 the Pluto system asks for, as it must be for a body this rock-rich at a similar core
# fraction: the core carries 77.0 percent of the mass. The result is a 288.6 km ice shell, a surface
# gravity of 0.7808 m/s2, and a central pressure of 1.93 GPa. C/MR2 comes out at 0.31554; Triton has no
# measured moment of inertia, so that is a model output and not a check.
#
# There is no ocean, although a subsurface one is likely given the heat a captured orbit would have
# delivered. To model it, split the shell and set is_solid = false on the lower part.
#
# Temperatures and viscosities
# Every layer carries a temperature and a reference-law viscosity at it (see io.toml): the core at 273.15 K
# and 1e22 Pa s, the shell at 35 K and 1e15 Pa s with the 59.4 kJ/mol activation energy of ice. Both
# temperatures are the classic file's and neither viscosity is calibrated to an observation.
#
# Tides
# Triton's orbit is retrograde and very nearly circular (e = 1.6e-5), so the present tide is small, and the
# retrograde motion is why Triton is decaying toward Neptune rather than receding. The tidal_scale values
# are the fractions of the total each layer takes in the 3D heating integral at the 5.8769 day orbital
# period, which puts 93.9 percent in the ice shell; they are unchanged to four digits between
# eccentricities of 0.001 and 0.01.
#
# Orbital state is not a world property in this schema; add Triton to a System to give it an orbit. The
# spin frequency is the synchronous rate of the classic file's 5.876854 day period.
schema_version = "0.2.0"
name = "Triton"
type = "terrestrial"
radius_m = 1352600.0
mass_kg = 2.1402926e22
spin_frequency_rad_s = 1.2374317e-05
albedo = 0.82

# The layer temperatures below are prescribed, not solved: the fit holds at exactly these values, so the
# world pins the equation-of-state solve to keep them (a call may still pass solve_temperature = true).
[eos_solver]
solve_temperature = false

[layers.core]
class = "solidliquid"
type = "mantle_rock"
layer_index = 0
radius_outer_m = 1064000.0            # classic WorldPack triton.toml
is_tidal = true
tidal_scale = 0.061354
temperature_k = 273.15

[layers.core.material]
model = "bm"
reference_density_kg_m3 = 3242.4854   # fitted to the published mass
reference_bulk_modulus_pa = 1.28e11   # forsterite-like
bulk_modulus_derivative = 4.2

[layers.core.material.shear_viscosity]
model = "reference"
reference_viscosity_pas = 1.0e22
reference_temperature_k = 273.15
molar_activation_energy_j_mol = 3.0e5
molar_activation_volume_m3_mol = 0.0

[layers.ice_shell]
class = "solidliquid"
type = "ice"
layer_index = 1
radius_fraction = 1.0
is_tidal = true
tidal_scale = 0.938646
temperature_k = 35.0

[layers.ice_shell.material]
model = "bm"
reference_density_kg_m3 = 917.0
reference_bulk_modulus_pa = 9.6e9     # ice I
bulk_modulus_derivative = 5.5

[layers.ice_shell.material.shear_viscosity]
model = "reference"
reference_viscosity_pas = 1.0e15
reference_temperature_k = 35.0
molar_activation_energy_j_mol = 59.4e3
molar_activation_volume_m3_mol = 0.0
