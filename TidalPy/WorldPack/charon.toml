# Charon: a rock core under a water-ice shell, the smaller half of a mutually synchronous binary; no ocean.
# Radius 606.0 km (Nimmo et al. 2017); mass 1.5896798e21 kg from GM = 106.1 km3/s2, mean density 1705 kg/m3
# (Brozovic and Jacobson 2024).
# Pluto's recipe: ice I 917 kg/m3 and a hydrated-silicate core reference density 3000 kg/m3 are fixed, and the
# 437.868 km core radius is fitted to the mass. Shell 168.1 km; the core holds 66.4 percent of the mass (Pluto 70.4).
# g = 0.2889 m/s2; central pressure 0.29 GPa. C/MR2 = 0.31178 is a model output: none is measured.
# Generic, uncalibrated temperatures and viscosities: core 300 K, 1e22 Pa s; shell 40 K, 1e15 Pa s (E = 59.4 kJ/mol).
# At the 6.3872 day mutual period the ice shell takes 97.9 percent of the heating.
# To add an ocean, split the shell and give the lower part a liquid-only material.
# Spin is the synchronous rate of the 6.3872304 day mutual period.
schema_version = "0.2.0"
name = "Charon"
type = "terrestrial"
radius_m = 606000.0
mass_kg = 1.5896798e21
spin_frequency_rad_s = 1.1385538e-05
albedo = 0.29

# Temperatures are prescribed (the fit holds at these values), so the EOS solve keeps them.
[eos_solver]
solve_temperature = false

[layers.core]
layer_index = 0
radius_outer_m = 437868.0695          # fitted to the mass
use_tides = true
temperature_k = 300.0
use_heating = true

[layers.core.material.solid]
thermal_conductivity_w_mk = 3.75

[layers.core.material.solid.eos]
model = "birch_murnaghan"
reference_density_kg_m3 = 3000.0      # hydrated silicate, as pluto.toml
reference_bulk_modulus_pa = 1.28e11   # forsterite-like
bulk_modulus_derivative = 4.2
thermal_expansion_1_k = 5.2e-5

[layers.core.material.solid.shear_modulus]
model = "constant"
shear_modulus_pa = 6.0e10

[layers.core.material.solid.shear_viscosity]
model = "reference"
reference_viscosity_pas = 1.0e22
reference_temperature_k = 300.0
molar_activation_energy_j_mol = 3.0e5
molar_activation_volume_m3_mol = 0.0

[layers.core.shear_rheology]
model = "andrade"
alpha = 0.3
zeta = 1.0

[layers.core.cooling]
model = "convection"
convection_alpha = 1.0
convection_beta = 0.3333333333333333
critical_rayleigh = 1100.0

[layers.core.radiogenics]
model = "isotope"
isotopes = "modern_day_chondritic"

[layers.ice_shell]
layer_index = 1
radius_fraction = 1.0
use_tides = true
temperature_k = 40.0
use_heating = true

[layers.ice_shell.material.solid]
thermal_conductivity_w_mk = 2.3
heat_capacity_j_kgk = 2000.0

[layers.ice_shell.material.solid.eos]
model = "birch_murnaghan"
reference_density_kg_m3 = 917.0
reference_bulk_modulus_pa = 9.6e9     # ice I
bulk_modulus_derivative = 5.5
thermal_expansion_1_k = 5.0e-5

[layers.ice_shell.material.solid.shear_modulus]
model = "constant"
shear_modulus_pa = 3.3e9

[layers.ice_shell.material.solid.shear_viscosity]
model = "reference"
reference_viscosity_pas = 1.0e15
reference_temperature_k = 40.0
molar_activation_energy_j_mol = 59.4e3
molar_activation_volume_m3_mol = 0.0

[layers.ice_shell.shear_rheology]
model = "maxwell"

[layers.ice_shell.cooling]
model = "convection"
convection_alpha = 1.0
convection_beta = 0.3333333333333333
critical_rayleigh = 1600.0
