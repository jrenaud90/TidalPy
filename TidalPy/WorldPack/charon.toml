# Charon: a rock core under one water-ice layer, the smaller half of a mutually synchronous binary; no ocean.
# Radius 606.0 km (Nimmo et al. 2017); mass 1.5896798e21 kg from GM = 106.1 km3/s2, mean density 1705 kg/m3
# (Brozovic and Jacobson 2024).
# As in pluto.toml, the hydrosphere is MatPack's ice_ih with melting on, and the hydrated-silicate core reference
# density, 3000 kg/m3, is fixed; the 437.497 km core radius is fitted to the mass. Shell 168.5 km; the core holds 66.3
# percent of the mass (Pluto 68.8).
# g = 0.2889 m/s2; central pressure 0.29 GPa. C/MR2 = 0.31197 is a model output, since none is measured.
# Charon is frozen through and cold, as a conducting shell carrying its small radiogenic heat would be. Its tectonics
# point to an ocean that has since refrozen; above about 269 K the layer grows one again at the base of the shell.
# The hydrosphere is at 150 K (2e23 Pa s) and the core at 260 K, where its conduction carries about its radiogenic heat.
# k2 = 0.00113, Q = 2500 at the 6.3872 day mutual period, nearly all of the heating in the ice. Andrade creep keeps the
# cold ice dissipating; the layer at 200 K gives Q = 78 and at 240 K Q = 12.
# With the temperature solved under a 41 K surface the base of the shell warms to 187 K, no ocean forms, and Q = 660.
# A warm, convecting hydrosphere (above about 165 K) is nearly fluid at forcing frequencies near 1e-16 rad/s, where the
# Love solve then fails at rtol = 1e-10.
# Its cooling models are those of pluto.toml, so a long thermal System.evolve run behaves similarly (see there).
# Core viscosity, rheology, and spin are as in pluto.toml.
schema_version = "0.2.0"
name = "Charon"
type = "terrestrial"
radius_m = 606000.0
mass_kg = 1.5896798e21
spin_frequency_rad_s = 1.1385538e-05
albedo = 0.29

# Temperatures are prescribed (the fit holds at these values), so the EOS solve keeps them.
[eos_solver]
solve_temperature = false

[layers.core]
layer_index = 0
radius_outer_m = 437497.0629          # fitted to the mass
use_tides = true
temperature_k = 260.0
use_heating = true

[layers.core.material.solid]
thermal_conductivity_w_mk = 3.75

[layers.core.material.solid.eos]
model = "birch_murnaghan"
reference_density_kg_m3 = 3000.0      # hydrated silicate, as pluto.toml
reference_bulk_modulus_pa = 1.28e11   # forsterite-like
bulk_modulus_derivative = 4.2
thermal_expansion_1_k = 5.2e-5

[layers.core.material.solid.shear_modulus]
model = "constant"
shear_modulus_pa = 6.0e10

# Silicate creep referenced to the upper mantle, 1e21 Pa s at 1600 K.
[layers.core.material.solid.shear_viscosity]
model = "reference"
reference_viscosity_pas = 1.0e21
reference_temperature_k = 1600.0
molar_activation_energy_j_mol = 3.0e5
molar_activation_volume_m3_mol = 0.0

[layers.core.shear_rheology]
model = "andrade"
alpha = 0.3
zeta = 1.0

[layers.core.cooling]
model = "convection"
convection_alpha = 1.0
convection_beta = 0.3333333333333333
critical_rayleigh = 1100.0

[layers.core.radiogenics]
model = "isotope"
isotopes = "modern_day_chondritic"

# Ice Ih over liquid water in one layer, solid below its melting point and liquid above it.
[layers.hydrosphere]
layer_index = 1
radius_fraction = 1.0
material = "ice_ih"
state = "auto"
use_melting = true
use_pressure_melting = true
use_melt_density = true
use_tides = true
temperature_k = 150.0
use_heating = true

[layers.hydrosphere.cooling]
model = "convection"
convection_alpha = 1.0
convection_beta = 0.3333333333333333
critical_rayleigh = 1600.0
