# Jupiter-Simple: one uniform fluid layer at Jupiter's mean density, the minimal gas-giant example of the schema.
# It reproduces the mass only: C/MR2 = 0.4 (uniform sphere) vs Jupiter's 0.264, and k2 = 1.5 (fluid sphere) vs
# 0.590. jupiter.toml is the three-layer version that matches both.
# Tides as in jupiter.toml: constant phase lag, k2 = 0.590, Q = 53500 (Lainey et al. 2009, k2/Q = 1.10e-5).
# Without them the packaged gas-giant default (a 600 s time lag) would dissipate about 4400 times too much.
schema_version = "0.2.0"
name = "Jupiter-Simple"
type = "gasgiant"
radius_m = 69911000.0
mass_kg = 1.898e27
spin_frequency_rad_s = 1.7585e-4

# The layer temperature is prescribed, not solved.
[eos_solver]
solve_temperature = false

[tides]
global_tidal_model = "fixed_q"
fixed_k = [0.59, 0.295, 0.1967, 0.1475, 0.118, 0.0983, 0.0843, 0.0738, 0.0656]
fixed_q = [53500.0, 53500.0, 53500.0, 53500.0, 53500.0, 53500.0, 53500.0, 53500.0, 53500.0]

[layers.envelope]
layer_index = 0
radius_fraction = 1.0
use_tides = true
temperature_k = 165.0
use_heating = true

[layers.envelope.material.liquid.eos]
model = "constant"
reference_density_kg_m3 = 1326.0841   # the mean density, so the solved mass matches the stated one
