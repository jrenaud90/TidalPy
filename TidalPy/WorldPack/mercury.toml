# Mercury: a large iron core, solid inside and fluid outside, under a thin silicate mantle.
# Radius and core boundaries are TidalPy 0.7's (inner core from Goossens et al. 2021); mass 3.30103e23 kg from
# GM = 22031.86855 km3/s2.
# The core holds 78 percent of the mass, so it is the fitted layer: 7305.6948 kg/m3 for both core layers under a
# fixed 3300 kg/m3 mantle (g = 3.7006 m/s2; central pressure 34.9 GPa). C/MR2 = 0.3465 vs 0.346 measured.
# Generic temperatures and viscosities (law as in io.toml, E = 300 kJ/mol): inner core 1800 K, 1e20 Pa s; mantle
# 1600 K, 1e21 Pa s, Andrade. Mercury's Q is not measured, so neither viscosity is calibrated.
# Fitted: mantle rigidity 4.347e10 Pa gives k2 = 0.569 at the 87.9691 day orbital period (Genova et al. 2019:
# 0.569 +/- 0.025), with Q = 120. With the outer core made solid, k2 drops to 0.1158.
# Heating with the Sun's mass at a = 5.7909e10 m, e = 0.2056, 3:2 spin: 1.9e9 W; the mantle takes all but 7e-6.
# Spin is the 58.6462 day sidereal rotation (3:2 resonance, not synchronous).
schema_version = "0.2.0"
name = "Mercury"
type = "terrestrial"
radius_m = 2440000.0
mass_kg = 3.30103e23
spin_frequency_rad_s = 1.240013e-06
albedo = 0.068

# Temperatures are prescribed (the fits hold at these values), so the EOS solve keeps them.
[eos_solver]
solve_temperature = false

[layers.inner_core]
layer_index = 0
radius_outer_m = 1277250.0
use_tides = true
temperature_k = 1800.0
use_heating = true

[layers.inner_core.material.solid]
thermal_conductivity_w_mk = 7.95
heat_capacity_j_kgk = 840.0

[layers.inner_core.material.solid.eos]
model = "constant"
reference_density_kg_m3 = 7305.6948   # fitted to the mass
bulk_modulus_pa = 1.6e11
thermal_expansion_1_k = 1.2e-5

[layers.inner_core.material.solid.shear_modulus]
model = "constant"
shear_modulus_pa = 5.25e10

[layers.inner_core.material.solid.shear_viscosity]
model = "reference"
reference_viscosity_pas = 1.0e20
reference_temperature_k = 1800.0
molar_activation_energy_j_mol = 3.0e5
molar_activation_volume_m3_mol = 0.0

[layers.inner_core.shear_rheology]
model = "maxwell"

[layers.outer_core]
layer_index = 1
radius_outer_m = 1965000.0
use_tides = false
temperature_k = 1800.0

# Liquid-only material: a static fluid outer core.
[layers.outer_core.material.liquid]
thermal_conductivity_w_mk = 7.95
heat_capacity_j_kgk = 840.0

[layers.outer_core.material.liquid.eos]
model = "constant"
reference_density_kg_m3 = 7305.6948   # same as the inner core
bulk_modulus_pa = 1.6e11
thermal_expansion_1_k = 1.2e-5

[layers.mantle]
layer_index = 2
radius_fraction = 1.0
use_tides = true
temperature_k = 1600.0
use_pressure_melting = true
use_melting = true
use_heating = true

[layers.mantle.material.solid]
thermal_conductivity_w_mk = 3.75

[layers.mantle.material.solid.eos]
model = "birch_murnaghan"
reference_density_kg_m3 = 3300.0      # fixed; the core is fitted
reference_bulk_modulus_pa = 1.28e11   # forsterite-like
bulk_modulus_derivative = 4.2
thermal_expansion_1_k = 5.2e-5

[layers.mantle.material.solid.shear_modulus]
model = "constant"
shear_modulus_pa = 4.347e10           # fitted to k2

[layers.mantle.material.solid.shear_viscosity]
model = "reference"
reference_viscosity_pas = 1.0e21
reference_temperature_k = 1600.0
molar_activation_energy_j_mol = 3.0e5
molar_activation_volume_m3_mol = 0.0

[layers.mantle.material]
latent_heat_j_kg = 4.0e5

[layers.mantle.material.liquid]
preset = "peridotite"                   # silicate melt

# Peridotite melting curves (Monteux et al. 2016) with Henning weakening.
[layers.mantle.material.melting]
preset = "peridotite"

[layers.mantle.shear_rheology]
model = "andrade"
alpha = 0.3
zeta = 1.0

[layers.mantle.cooling]
model = "convection"
convection_alpha = 1.0
convection_beta = 0.3333333333333333
critical_rayleigh = 1100.0

[layers.mantle.radiogenics]
model = "isotope"
isotopes = "modern_day_chondritic"
