# Europa: Fe-FeS core, silicate mantle, and a 140 km solid ice shell with no ocean (see europa_dynamic.toml).
# Radius and boundaries (core 599 km, mantle top 1421 km) are TidalPy 0.7's; mass 4.7998e22 kg.
# Core 5150 kg/m3 (as Io) and ice I 917 kg/m3; the mantle reference density, 3532.34 kg/m3 (high for Europa
# models), reproduces the mass (g = 1.315 m/s2; central pressure 4.82 GPa).
# C/MR2 = 0.3437 vs 0.346 measured (Anderson et al. 1998).
# Temperatures and viscosities are generic, not calibrated: core 1500 K, 1e20 Pa s; mantle 1400 K, 1e21 Pa s;
# shell 250 K, 1e15 Pa s (E = 59.4 kJ/mol for ice, 300 kJ/mol otherwise; law as in io.toml).
# Without an ocean it responds as a solid body: k2 = 0.0153 at the orbital period (about 0.25 with an ocean) and
# 6.3e10 W with Jupiter's mass and Europa's orbit, far below the 1e12 W class of an ocean-decoupled shell.
# Heating shares: core 5.6e-4, mantle 0.7619, shell 0.2376.
# Spin is the synchronous rate for a 3.551181 day period. In a System keep it synchronous with
# world.set_spin_frequency(system.calc_orbital_frequency(world)).
schema_version = "0.2.0"
name = "Europa"
type = "terrestrial"
radius_m = 1561000.0
mass_kg = 4.7998e22
spin_frequency_rad_s = 2.047827e-05
albedo = 0.67

# Temperatures are prescribed (the fit holds at these values), so the EOS solve keeps them.
[eos_solver]
solve_temperature = false

[layers.core]
layer_index = 0
radius_outer_m = 599000.0
use_tides = true
temperature_k = 1500.0
use_heating = true

[layers.core.material.solid]
thermal_conductivity_w_mk = 7.95
heat_capacity_j_kgk = 840.0

[layers.core.material.solid.eos]
model = "constant"
reference_density_kg_m3 = 5150.0
bulk_modulus_pa = 1.6e11
thermal_expansion_1_k = 1.2e-5

[layers.core.material.solid.shear_modulus]
model = "constant"
shear_modulus_pa = 5.25e10

[layers.core.material.solid.shear_viscosity]
model = "reference"
reference_viscosity_pas = 1.0e20
reference_temperature_k = 1500.0
molar_activation_energy_j_mol = 3.0e5
molar_activation_volume_m3_mol = 0.0

[layers.core.shear_rheology]
model = "maxwell"

[layers.mantle]
layer_index = 1
radius_outer_m = 1421000.0
use_tides = true
temperature_k = 1400.0
use_pressure_melting = true
use_melting = true
use_heating = true

[layers.mantle.material.solid]
thermal_conductivity_w_mk = 3.75

[layers.mantle.material.solid.eos]
model = "birch_murnaghan"
reference_density_kg_m3 = 3532.3413
reference_bulk_modulus_pa = 1.28e11   # forsterite-like
bulk_modulus_derivative = 4.2
thermal_expansion_1_k = 5.2e-5

[layers.mantle.material.solid.shear_modulus]
model = "constant"
shear_modulus_pa = 6.0e10

[layers.mantle.material.solid.shear_viscosity]
model = "reference"
reference_viscosity_pas = 1.0e21
reference_temperature_k = 1400.0
molar_activation_energy_j_mol = 3.0e5
molar_activation_volume_m3_mol = 0.0

[layers.mantle.material]
latent_heat_j_kg = 4.0e5

[layers.mantle.material.liquid]
preset = "peridotite"                   # silicate melt

# Peridotite melting curves (Monteux et al. 2016) with Henning weakening.
[layers.mantle.material.melting]
preset = "peridotite"

[layers.mantle.shear_rheology]
model = "andrade"
alpha = 0.3
zeta = 1.0

[layers.mantle.cooling]
model = "convection"
convection_alpha = 1.0
convection_beta = 0.3333333333333333
critical_rayleigh = 1100.0

[layers.mantle.radiogenics]
model = "isotope"
isotopes = "modern_day_chondritic"

[layers.ice_shell]
layer_index = 2
radius_fraction = 1.0
use_tides = true
temperature_k = 250.0
use_heating = true

[layers.ice_shell.material.solid]
thermal_conductivity_w_mk = 2.3
heat_capacity_j_kgk = 2000.0

[layers.ice_shell.material.solid.eos]
model = "birch_murnaghan"
reference_density_kg_m3 = 917.0
reference_bulk_modulus_pa = 9.6e9     # ice I
bulk_modulus_derivative = 5.5
thermal_expansion_1_k = 5.0e-5

[layers.ice_shell.material.solid.shear_modulus]
model = "constant"
shear_modulus_pa = 3.3e9

[layers.ice_shell.material.solid.shear_viscosity]
model = "reference"
reference_viscosity_pas = 1.0e15      # warm ice
reference_temperature_k = 250.0
molar_activation_energy_j_mol = 59.4e3
molar_activation_volume_m3_mol = 0.0

[layers.ice_shell.shear_rheology]
model = "maxwell"

[layers.ice_shell.cooling]
model = "convection"
convection_alpha = 1.0
convection_beta = 0.3333333333333333
critical_rayleigh = 1600.0
