# TRAPPIST-1e: a two-layer rocky planet. Mass and radius from Agol et al. (2021): 0.692 Earth masses, 0.92 Earth radii
# (mean density 4900 kg/m3). Orbital period 6.101013 days, a = 0.02925 AU.
# All seven planets share one recipe, a constant-density liquid iron core at Earth's mean core density (10900 kg/m3)
# under a Birch-Murnaghan silicate mantle at earth_simple's reference density (3516.322 kg/m3).
# Fitted: core radius 2735.6 km (0.4667 of the radius) to the mass. Core mass fraction 0.2262, 0.64 times Earth's
# 0.354 by the same recipe: iron-depleted, as Agol et al. (2021) conclude. The recipe overstates Earth's (accepted
# 0.325), so treat absolute core fractions with caution.
# g = 8.0289 m/s2, central pressure 231 GPa. C/MR2 = 0.34495 is a model output; none is measured for TRAPPIST-1.
# Temperatures and viscosities are nominal Earth-like values (core 4000 K; Andrade mantle 1600 K, 1e21 Pa s) with
# nothing to constrain them. Set the mantle viscosity before trusting any dissipation number. The mantle shear
# modulus, 6e10 Pa, is nominal too (earth_simple's mantle has 2.2e11 Pa), and k2 depends on it strongly.
# The core is a static liquid, though at 4000 K and these pressures iron would likely be solid in the larger planets.
# A solid Maxwell iron core (1e20 Pa s) also solves at every forcing frequency; it relaxes like a fluid below about
# 1e-12 rad/s, where its k2 approaches the liquid core's.
# k2 = 0.442, Q = 193 at the orbital period. With the temperature solved under its 228 K equilibrium surface,
# the mantle's lower boundary layer reaches the core's 4000 K and Q = 28.
# Spin is synchronous with the orbit. With e = 0.00632 (Agol et al. 2021) the mantle takes all of the tidal
# heating. Add the planet and its star to a System to give it an orbit.
schema_version = "0.2.0"
name = "TRAPPIST-1e"
type = "terrestrial"
radius_m = 5861327.4
mass_kg = 4.1327614e+24
spin_frequency_rad_s = 1.1919668e-05

# Layer temperatures are prescribed, not solved: the fit holds at these values.
[eos_solver]
solve_temperature = false

[layers.core]
layer_index = 0
radius_outer_m = 2735628.7           # fitted to the published mass
use_tides = false
temperature_k = 4000.0

# Liquid-only material, so the core is a static fluid (see the header).
[layers.core.material.liquid]
thermal_conductivity_w_mk = 7.95
heat_capacity_j_kgk = 840.0

[layers.core.material.liquid.eos]
model = "constant"
reference_density_kg_m3 = 10900.0     # Earth's mean core density
bulk_modulus_pa = 1.6e11
thermal_expansion_1_k = 1.2e-5

[layers.mantle]
layer_index = 1
radius_fraction = 1.0
use_tides = true
temperature_k = 1600.0
use_pressure_melting = true
use_melting = true
use_heating = true

[layers.mantle.material.solid]
thermal_conductivity_w_mk = 3.75

[layers.mantle.material.solid.eos]
model = "birch_murnaghan"
reference_density_kg_m3 = 3516.322    # the reference density of earth_simple
reference_bulk_modulus_pa = 1.28e11   # forsterite-like
bulk_modulus_derivative = 4.2
thermal_expansion_1_k = 5.2e-5

[layers.mantle.material.solid.shear_modulus]
model = "constant"
shear_modulus_pa = 6.0e10

[layers.mantle.material.solid.shear_viscosity]
model = "reference"
reference_viscosity_pas = 1.0e21
reference_temperature_k = 1600.0
molar_activation_energy_j_mol = 3.0e5
molar_activation_volume_m3_mol = 0.0

[layers.mantle.material]
latent_heat_j_kg = 4.0e5

[layers.mantle.material.liquid]
preset = "peridotite"

# Peridotite melting curves (Monteux et al. 2016) and Henning weakening.
[layers.mantle.material.melting]
preset = "peridotite"

[layers.mantle.shear_rheology]
model = "andrade"
alpha = 0.3
zeta = 1.0

[layers.mantle.cooling]
model = "convection"
convection_alpha = 1.0
convection_beta = 0.3333333333333333
critical_rayleigh = 1100.0

[layers.mantle.radiogenics]
model = "isotope"
isotopes = "modern_day_chondritic"
