# A miniature Solar System: the Sun with Earth (earth_simple) and Jupiter (jupiter_simple) orbiting it.
# `tidal_host` names the world that raises a planet's tides; the Sun has none, so it is not tidally forced.
# The host here is the star, so no stellar orbit is given; a moon under a distant star states one with
# `stellar_semi_major_axis_m` and `stellar_eccentricity`.
schema_version = "0.2.0"
name = "Sol System"

[worlds.sun]
world = "sol"
is_star = true

[worlds.earth]
world = "earth_simple"
tidal_host = "sun"
semi_major_axis_m = 1.495978707e11
eccentricity = 0.0167

[worlds.jupiter]
world = "jupiter_simple"
tidal_host = "sun"
semi_major_axis_m = 7.785472e11
eccentricity = 0.0489
