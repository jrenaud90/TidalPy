# Pluto-Dynamic: pluto.toml with the liquid zone of its hydrosphere solved as a dynamic liquid (is_static = false).
# The ocean's density follows its bulk modulus (MatPack water, 1027.5 to 1083.6 kg/m3), which keeps the dynamic solve
# neutrally stratified (see Demos/Physics/P12_dynamic_liquids.ipynb). Structure, mass, and C/MR2 are pluto.toml's.
# k2 = 0.3203, Q = 4.26 at the 6.3872 day mutual period; pluto.toml's static ocean is within 2.4e-4.
# A dynamic liquid between solids is ill-conditioned at long periods, so the Love solve fails at forcing frequencies of
# 1e-8 rad/s and below, where pluto.toml's static ocean solves down to 1e-16 rad/s.
# Temperatures, viscosities, and spin are as in pluto.toml.
schema_version = "0.2.0"
name = "Pluto-Dynamic"
type = "terrestrial"
radius_m = 1188300.0
mass_kg = 1.3024587e22
spin_frequency_rad_s = 1.1385538e-05
albedo = 0.72

# Temperatures are prescribed (the fit holds at these values), so the EOS solve keeps them.
[eos_solver]
solve_temperature = false

[layers.core]
layer_index = 0
radius_outer_m = 892154.7870          # pluto.toml
use_tides = true
temperature_k = 600.0
use_heating = true

[layers.core.material.solid]
thermal_conductivity_w_mk = 3.75

[layers.core.material.solid.eos]
model = "birch_murnaghan"
reference_density_kg_m3 = 3000.0      # hydrated silicate, as charon.toml
reference_bulk_modulus_pa = 1.28e11   # forsterite-like
bulk_modulus_derivative = 4.2
thermal_expansion_1_k = 5.2e-5

[layers.core.material.solid.shear_modulus]
model = "constant"
shear_modulus_pa = 6.0e10

# Silicate creep referenced to the upper mantle, 1e21 Pa s at 1600 K.
[layers.core.material.solid.shear_viscosity]
model = "reference"
reference_viscosity_pas = 1.0e21
reference_temperature_k = 1600.0
molar_activation_energy_j_mol = 3.0e5
molar_activation_volume_m3_mol = 0.0

[layers.core.shear_rheology]
model = "andrade"
alpha = 0.3
zeta = 1.0

[layers.core.cooling]
model = "convection"
convection_alpha = 1.0
convection_beta = 0.3333333333333333
critical_rayleigh = 1100.0

[layers.core.radiogenics]
model = "isotope"
isotopes = "modern_day_chondritic"

# Ice Ih over liquid water in one layer, solid below its melting point and liquid above it.
[layers.hydrosphere]
layer_index = 1
radius_fraction = 1.0
material = "ice_ih"
state = "auto"
use_melting = true
use_pressure_melting = true
use_melt_density = true
use_tides = true
is_static = false                     # a dynamic liquid zone
temperature_k = 268.197               # pluto.toml
use_heating = true

[layers.hydrosphere.cooling]
model = "convection"
convection_alpha = 1.0
convection_beta = 0.3333333333333333
critical_rayleigh = 1600.0
