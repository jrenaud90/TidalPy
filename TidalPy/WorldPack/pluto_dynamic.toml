# Pluto-Dynamic: pluto.toml with its ocean solved as a dynamic, compressible liquid; only the ocean and the core
# density differ.
# A constant-density dynamic liquid is unstably stratified and fails (pluto.toml's ocean by a 30 day period), so
# the ocean's density follows its bulk modulus (see Demos/Physics/P12_dynamic_liquids.ipynb).
# Ocean density runs from 1044 to 1076 kg/m3 (mean 1061); the isothermal law ignores the layer's 260 K.
# Fitted: core reference density 2918.9293 kg/m3 to the mass (g = 0.6156 m/s2; central pressure 1.18 GPa).
# C/MR2 = 0.31979 is a model output: none is measured.
# k2 = 0.1556 at the 6.3872 day mutual period (pluto.toml: 0.1458); a static ocean is within 1.4e-4, so the
# difference is the denser, compressible ocean, not its dynamics.
# Temperatures, viscosities, and spin are as in pluto.toml.
schema_version = "0.2.0"
name = "Pluto-Dynamic"
type = "terrestrial"
radius_m = 1188300.0
mass_kg = 1.3024587e22
spin_frequency_rad_s = 1.1385538e-05
albedo = 0.72

# Temperatures are prescribed (the fit holds at these values), so the EOS solve keeps them.
[eos_solver]
solve_temperature = false

[layers.core]
layer_index = 0
radius_outer_m = 910903.0             # TidalPy 0.7 pluto.toml
use_tides = true
temperature_k = 300.0
use_heating = true

[layers.core.material.solid]
thermal_conductivity_w_mk = 3.75

[layers.core.material.solid.eos]
model = "birch_murnaghan"
reference_density_kg_m3 = 2918.9293   # fitted to the mass
reference_bulk_modulus_pa = 1.28e11   # forsterite-like
bulk_modulus_derivative = 4.2
thermal_expansion_1_k = 5.2e-5

[layers.core.material.solid.shear_modulus]
model = "constant"
shear_modulus_pa = 6.0e10

[layers.core.material.solid.shear_viscosity]
model = "reference"
reference_viscosity_pas = 1.0e22
reference_temperature_k = 300.0
molar_activation_energy_j_mol = 3.0e5
molar_activation_volume_m3_mol = 0.0

[layers.core.shear_rheology]
model = "andrade"
alpha = 0.3
zeta = 1.0

[layers.core.cooling]
model = "convection"
convection_alpha = 1.0
convection_beta = 0.3333333333333333
critical_rayleigh = 1100.0

[layers.core.radiogenics]
model = "isotope"
isotopes = "modern_day_chondritic"

[layers.ocean]
layer_index = 1
radius_outer_m = 1023300.0            # 165 km below the surface, Nimmo et al. (2016)
use_tides = false
is_static = false
temperature_k = 260.0

[layers.ocean.material.liquid]
thermal_conductivity_w_mk = 2.3
heat_capacity_j_kgk = 2000.0

[layers.ocean.material.liquid.eos]
model = "birch_murnaghan"
reference_density_kg_m3 = 999.84      # IAPWS-95 fit at 273.15 K, 0 to 0.2 GPa
reference_bulk_modulus_pa = 1.937e9
bulk_modulus_derivative = 6.84
thermal_expansion_1_k = 5.0e-5

[layers.ice_shell]
layer_index = 2
radius_fraction = 1.0
use_tides = true
temperature_k = 200.0
use_heating = true

[layers.ice_shell.material.solid]
thermal_conductivity_w_mk = 2.3
heat_capacity_j_kgk = 2000.0

[layers.ice_shell.material.solid.eos]
model = "birch_murnaghan"
reference_density_kg_m3 = 917.0
reference_bulk_modulus_pa = 9.6e9     # ice I
bulk_modulus_derivative = 5.5
thermal_expansion_1_k = 5.0e-5

[layers.ice_shell.material.solid.shear_modulus]
model = "constant"
shear_modulus_pa = 3.3e9

[layers.ice_shell.material.solid.shear_viscosity]
model = "reference"
reference_viscosity_pas = 1.0e15
reference_temperature_k = 200.0
molar_activation_energy_j_mol = 59.4e3
molar_activation_volume_m3_mol = 0.0

[layers.ice_shell.shear_rheology]
model = "maxwell"

[layers.ice_shell.cooling]
model = "convection"
convection_alpha = 1.0
convection_beta = 0.3333333333333333
critical_rayleigh = 1600.0
