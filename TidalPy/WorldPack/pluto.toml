# Pluto: a rock core under one water layer, ice Ih over an ocean, the larger half of a mutually synchronous binary.
# Radius 1188.3 km (Nimmo et al. 2017); mass 1.3024587e22 kg from GM = 869.3 km3/s2, mean density 1853 kg/m3
# (Brozovic and Jacobson 2024).
# The hydrosphere is MatPack's ice_ih with melting on, solid below its pressure-dependent melting point and liquid
# above it, so its ocean grows or freezes with its temperature. At 268.197 K the solid zone is the 100 km shell that
# keeps the ocean uplift under Sputnik Planitia (Kihoulou et al. 2022; 65 to 90 km from the basin's forebulge, Schmidt
# and Salvini 2024), over a 196.1 km ocean of 1027.5 to 1083.6 kg/m3.
# The hydrated-silicate core reference density, 3000 kg/m3 (as charon.toml), is fixed, and the 892.155 km core radius is
# fitted to the mass. Core, ocean, and shell hold 68.8, 19.6, and 11.6 percent of it.
# g = 0.6156 m/s2; central pressure 1.22 GPa. C/MR2 = 0.31807 is a model output, since none is measured.
# The ice's diffusion creep gives 2.7e14 Pa s at 268 K. The core's silicate law (1e21 Pa s at 1600 K, E = 300 kJ/mol)
# leaves the 600 K core elastic; at that temperature its conduction carries about its present radiogenic heat.
# Both use Andrade creep with zeta = 1 (the Andrade time equals the Maxwell time).
# k2 = 0.3202, Q = 4.3 at the 6.3872 day mutual period, nearly all of the heating in the ice (no measured k2). With the
# layer frozen through at 250 K, k2 = 0.0053.
# With the temperature solved under a 32.5 K surface, the shell thins to 81.7 km and k2 = 0.348, Q = 5.0. Its ice
# convects at the layer temperature under a conducting boundary layer about 1 km thick.
# With these cooling models a thermal Pluto loses heat about 700 times faster than its radiogenic heating replaces
# it. Over 1 Gyr of System.evolve the hydrosphere cools from about 268 K to about 151 K and the ocean freezes, while
# the core, which has no melting law, warms from 600 K to about 1700 K.
# Spin is the synchronous rate of the 6.3872304 day mutual period.
schema_version = "0.2.0"
name = "Pluto"
type = "terrestrial"
radius_m = 1188300.0
mass_kg = 1.3024587e22
spin_frequency_rad_s = 1.1385538e-05
albedo = 0.72

# Temperatures are prescribed (the fit holds at these values), so the EOS solve keeps them.
[eos_solver]
solve_temperature = false

[layers.core]
layer_index = 0
radius_outer_m = 892154.7870          # fitted to the mass
use_tides = true
temperature_k = 600.0
use_heating = true

[layers.core.material.solid]
thermal_conductivity_w_mk = 3.75

[layers.core.material.solid.eos]
model = "birch_murnaghan"
reference_density_kg_m3 = 3000.0      # hydrated silicate, as charon.toml
reference_bulk_modulus_pa = 1.28e11   # forsterite-like
bulk_modulus_derivative = 4.2
thermal_expansion_1_k = 5.2e-5

[layers.core.material.solid.shear_modulus]
model = "constant"
shear_modulus_pa = 6.0e10

# Silicate creep referenced to the upper mantle, 1e21 Pa s at 1600 K.
[layers.core.material.solid.shear_viscosity]
model = "reference"
reference_viscosity_pas = 1.0e21
reference_temperature_k = 1600.0
molar_activation_energy_j_mol = 3.0e5
molar_activation_volume_m3_mol = 0.0

[layers.core.shear_rheology]
model = "andrade"
alpha = 0.3
zeta = 1.0

[layers.core.cooling]
model = "convection"
convection_alpha = 1.0
convection_beta = 0.3333333333333333
critical_rayleigh = 1100.0

[layers.core.radiogenics]
model = "isotope"
isotopes = "modern_day_chondritic"

# Ice Ih over liquid water in one layer, solid below its melting point and liquid above it.
[layers.hydrosphere]
layer_index = 1
radius_fraction = 1.0
material = "ice_ih"
state = "auto"
use_melting = true
use_pressure_melting = true
use_melt_density = true
use_tides = true
temperature_k = 268.197               # fitted to a 100 km solid zone
use_heating = true

[layers.hydrosphere.cooling]
model = "convection"
convection_alpha = 1.0
convection_beta = 0.3333333333333333
critical_rayleigh = 1600.0
