# Pluto: a rock core, a subsurface ocean, and a water-ice shell, the larger half of a mutually synchronous binary.
# Radius 1188.3 km (Nimmo et al. 2017); mass 1.3024587e22 kg from GM = 869.3 km3/s2, mean density 1853 kg/m3
# (Brozovic and Jacobson 2024). The 910.903 km core radius is TidalPy 0.7's; nothing constrains it independently.
# The 165 km shell is the depth to the ocean from Sputnik Planitia's reorientation (Nimmo et al. 2016); the
# 112.4 km ocean left above the core is not tuned and lies inside the 50 to 150 km of thermal evolution models.
# Ice I 917 kg/m3 and a fresh-water ocean 1000 kg/m3 are fixed; the core reference density, 2943.7302 kg/m3
# (hydrated silicate), is fitted to the mass. Core, ocean, and shell hold 71.9, 10.2, and 18.0 percent of it.
# g = 0.6156 m/s2; central pressure 1.20 GPa. C/MR2 = 0.31855 is a model output: none is measured.
# The static ocean decouples the shell: k2 = 0.1458 at the 6.3872 day mutual period vs 0.00457 with the ocean
# frozen into the shell. Pluto has no measured k2. The shell takes almost all of the heating; the ocean takes none.
# Generic, uncalibrated temperatures and viscosities: core 300 K, 1e22 Pa s (E = 300 kJ/mol); ocean 260 K;
# shell 200 K, 1e15 Pa s (E = 59.4 kJ/mol).
# Spin is the synchronous rate of the 6.3872304 day mutual period.
schema_version = "0.2.0"
name = "Pluto"
type = "terrestrial"
radius_m = 1188300.0
mass_kg = 1.3024587e22
spin_frequency_rad_s = 1.1385538e-05
albedo = 0.72

# Temperatures are prescribed (the fit holds at these values), so the EOS solve keeps them.
[eos_solver]
solve_temperature = false

[layers.core]
layer_index = 0
radius_outer_m = 910903.0             # TidalPy 0.7 pluto.toml
use_tides = true
temperature_k = 300.0
use_heating = true

[layers.core.material.solid]
thermal_conductivity_w_mk = 3.75

[layers.core.material.solid.eos]
model = "birch_murnaghan"
reference_density_kg_m3 = 2943.7302   # fitted to the mass
reference_bulk_modulus_pa = 1.28e11   # forsterite-like
bulk_modulus_derivative = 4.2
thermal_expansion_1_k = 5.2e-5

[layers.core.material.solid.shear_modulus]
model = "constant"
shear_modulus_pa = 6.0e10

[layers.core.material.solid.shear_viscosity]
model = "reference"
reference_viscosity_pas = 1.0e22
reference_temperature_k = 300.0
molar_activation_energy_j_mol = 3.0e5
molar_activation_volume_m3_mol = 0.0

[layers.core.shear_rheology]
model = "andrade"
alpha = 0.3
zeta = 1.0

[layers.core.cooling]
model = "convection"
convection_alpha = 1.0
convection_beta = 0.3333333333333333
critical_rayleigh = 1100.0

[layers.core.radiogenics]
model = "isotope"
isotopes = "modern_day_chondritic"

[layers.ocean]
layer_index = 1
radius_outer_m = 1023300.0            # 165 km below the surface, Nimmo et al. (2016)
use_tides = false
temperature_k = 260.0

# Liquid-only material: a static subsurface ocean.
[layers.ocean.material.liquid]
thermal_conductivity_w_mk = 2.3
heat_capacity_j_kgk = 2000.0

[layers.ocean.material.liquid.eos]
model = "constant"
reference_density_kg_m3 = 1000.0      # fresh water; a briny ocean would be denser
bulk_modulus_pa = 9.2e9
thermal_expansion_1_k = 5.0e-5

[layers.ice_shell]
layer_index = 2
radius_fraction = 1.0
use_tides = true
temperature_k = 200.0
use_heating = true

[layers.ice_shell.material.solid]
thermal_conductivity_w_mk = 2.3
heat_capacity_j_kgk = 2000.0

[layers.ice_shell.material.solid.eos]
model = "birch_murnaghan"
reference_density_kg_m3 = 917.0
reference_bulk_modulus_pa = 9.6e9     # ice I
bulk_modulus_derivative = 5.5
thermal_expansion_1_k = 5.0e-5

[layers.ice_shell.material.solid.shear_modulus]
model = "constant"
shear_modulus_pa = 3.3e9

[layers.ice_shell.material.solid.shear_viscosity]
model = "reference"
reference_viscosity_pas = 1.0e15
reference_temperature_k = 200.0
molar_activation_energy_j_mol = 59.4e3
molar_activation_volume_m3_mol = 0.0

[layers.ice_shell.shear_rheology]
model = "maxwell"

[layers.ice_shell.cooling]
model = "convection"
convection_alpha = 1.0
convection_beta = 0.3333333333333333
critical_rayleigh = 1600.0
