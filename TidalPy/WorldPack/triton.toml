# Triton: a rock core under a water-ice shell, on a retrograde synchronous orbit about Neptune; no ocean.
# Radius 1352.6 km; mass 2.1402926e22 kg from GM = 1428.49546 km3/s2 (JPL satellite ephemeris NEP097), mean
# density 2065 kg/m3. The 1064 km core radius is TidalPy 0.7's.
# Ice I fixed at 917 kg/m3 and the core reference density, 3242.4854 kg/m3, fitted to the mass.
# Shell 288.6 km; the core holds 77.0 percent of the mass; g = 0.7808 m/s2; central pressure 1.93 GPa.
# C/MR2 = 0.31554 is a model output: none is measured.
# Generic, uncalibrated temperatures and viscosities: core 273.15 K, 1e22 Pa s; shell 35 K, 1e15 Pa s
# (E = 59.4 kJ/mol).
# The orbit is nearly circular (e = 1.6e-5); at the 5.8769 day period the ice shell takes 93.9 percent of the heating.
# A subsurface ocean is likely; to add one, split the shell and give the lower part a liquid-only material.
# Spin is the synchronous rate of the 5.876854 day period.
schema_version = "0.2.0"
name = "Triton"
type = "terrestrial"
radius_m = 1352600.0
mass_kg = 2.1402926e22
spin_frequency_rad_s = 1.2374317e-05
albedo = 0.82

# Temperatures are prescribed (the fit holds at these values), so the EOS solve keeps them.
[eos_solver]
solve_temperature = false

[layers.core]
layer_index = 0
radius_outer_m = 1064000.0            # TidalPy 0.7 triton.toml
use_tides = true
temperature_k = 273.15
use_heating = true

[layers.core.material.solid]
thermal_conductivity_w_mk = 3.75

[layers.core.material.solid.eos]
model = "birch_murnaghan"
reference_density_kg_m3 = 3242.4854   # fitted to the mass
reference_bulk_modulus_pa = 1.28e11   # forsterite-like
bulk_modulus_derivative = 4.2
thermal_expansion_1_k = 5.2e-5

[layers.core.material.solid.shear_modulus]
model = "constant"
shear_modulus_pa = 6.0e10

[layers.core.material.solid.shear_viscosity]
model = "reference"
reference_viscosity_pas = 1.0e22
reference_temperature_k = 273.15
molar_activation_energy_j_mol = 3.0e5
molar_activation_volume_m3_mol = 0.0

[layers.core.shear_rheology]
model = "andrade"
alpha = 0.3
zeta = 1.0

[layers.core.cooling]
model = "convection"
convection_alpha = 1.0
convection_beta = 0.3333333333333333
critical_rayleigh = 1100.0

[layers.core.radiogenics]
model = "isotope"
isotopes = "modern_day_chondritic"

[layers.ice_shell]
layer_index = 1
radius_fraction = 1.0
use_tides = true
temperature_k = 35.0
use_heating = true

[layers.ice_shell.material.solid]
thermal_conductivity_w_mk = 2.3
heat_capacity_j_kgk = 2000.0

[layers.ice_shell.material.solid.eos]
model = "birch_murnaghan"
reference_density_kg_m3 = 917.0
reference_bulk_modulus_pa = 9.6e9     # ice I
bulk_modulus_derivative = 5.5
thermal_expansion_1_k = 5.0e-5

[layers.ice_shell.material.solid.shear_modulus]
model = "constant"
shear_modulus_pa = 3.3e9

[layers.ice_shell.material.solid.shear_viscosity]
model = "reference"
reference_viscosity_pas = 1.0e15
reference_temperature_k = 35.0
molar_activation_energy_j_mol = 59.4e3
molar_activation_volume_m3_mol = 0.0

[layers.ice_shell.shear_rheology]
model = "maxwell"

[layers.ice_shell.cooling]
model = "convection"
convection_alpha = 1.0
convection_beta = 0.3333333333333333
critical_rayleigh = 1600.0
