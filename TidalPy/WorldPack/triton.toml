# Triton: a rock core under one water layer, ice Ih over an ocean, on a retrograde synchronous orbit about Neptune.
# Radius 1352.6 km; mass 2.1402926e22 kg from GM = 1428.49546 km3/s2 (JPL satellite ephemeris NEP097), mean
# density 2065 kg/m3. The 1064 km core radius is TidalPy 0.7's; the core reference density, 3213.4729 kg/m3, is fitted
# to the mass.
# The hydrosphere is MatPack's ice_ih with melting on (see pluto.toml). At 255 K it is a 230.4 km shell over a 58.2 km
# ocean, likely but unconfirmed (Hussmann et al. 2006); at 250 K it freezes through and k2 = 0.0070.
# Core, ocean, and shell hold 76.3, 4.4, and 19.3 percent of the mass; g = 0.7808 m/s2; central pressure 1.90 GPa.
# C/MR2 = 0.31694 is a model output, since none is measured.
# k2 = 0.1849, Q = 5.8 at the 5.8769 day period, nearly all of the heating in the ice; the orbit is nearly circular
# (e = 1.6e-5). With the temperature solved under a 33 K surface, the ocean is 87.5 km and k2 = 0.206, Q = 5.9.
# Core viscosity and rheology are as in pluto.toml. Spin is the synchronous rate of the 5.876854 day period.
schema_version = "0.2.0"
name = "Triton"
type = "terrestrial"
radius_m = 1352600.0
mass_kg = 2.1402926e22
spin_frequency_rad_s = 1.2374317e-05
albedo = 0.82

# Temperatures are prescribed (the fit holds at these values), so the EOS solve keeps them.
[eos_solver]
solve_temperature = false

[layers.core]
layer_index = 0
radius_outer_m = 1064000.0            # TidalPy 0.7 triton.toml
use_tides = true
temperature_k = 600.0
use_heating = true

[layers.core.material.solid]
thermal_conductivity_w_mk = 3.75

[layers.core.material.solid.eos]
model = "birch_murnaghan"
reference_density_kg_m3 = 3213.4729   # fitted to the mass
reference_bulk_modulus_pa = 1.28e11   # forsterite-like
bulk_modulus_derivative = 4.2
thermal_expansion_1_k = 5.2e-5

[layers.core.material.solid.shear_modulus]
model = "constant"
shear_modulus_pa = 6.0e10

# Silicate creep referenced to the upper mantle, 1e21 Pa s at 1600 K.
[layers.core.material.solid.shear_viscosity]
model = "reference"
reference_viscosity_pas = 1.0e21
reference_temperature_k = 1600.0
molar_activation_energy_j_mol = 3.0e5
molar_activation_volume_m3_mol = 0.0

[layers.core.shear_rheology]
model = "andrade"
alpha = 0.3
zeta = 1.0

[layers.core.cooling]
model = "convection"
convection_alpha = 1.0
convection_beta = 0.3333333333333333
critical_rayleigh = 1100.0

[layers.core.radiogenics]
model = "isotope"
isotopes = "modern_day_chondritic"

# Ice Ih over liquid water in one layer, solid below its melting point and liquid above it.
[layers.hydrosphere]
layer_index = 1
radius_fraction = 1.0
material = "ice_ih"
state = "auto"
use_melting = true
use_pressure_melting = true
use_melt_density = true
use_tides = true
temperature_k = 255.0
use_heating = true

[layers.hydrosphere.cooling]
model = "convection"
convection_alpha = 1.0
convection_beta = 0.3333333333333333
critical_rayleigh = 1600.0
