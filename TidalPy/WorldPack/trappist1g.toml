# TRAPPIST-1g: a two-layer rocky planet of the seven-planet M-dwarf system, built from its measured mass and radius.
#
# TidalPy 0.7's trappist1g.toml carries no interior, so this one is built from scratch. Mass and radius are
# Agol et al. (2021): 1.321 Earth masses and 1.129 Earth radii, a mean density of 5061 kg/m3. The orbital period is
# 12.352446 days and the semi-major axis 0.04683 AU.
#
# Structure
# The recipe is the same for all seven planets, so their interiors can be compared: an incompressible iron core at
# Earth's mean core density of 10900 kg/m3 under a Birch-Murnaghan silicate mantle at the 3516.322 kg/m3 reference
# density of earth_simple. Both densities are held, so the core radius is the one number fitted to the published
# mass, 3108.9 km, or 0.4322 of the planet radius.
#
# The core mass fraction that follows, 0.1739, is a result rather than an input, and it is 0.49 times the 0.354
# that Earth gives through this identical recipe. Every one of the seven comes out below Earth, which is how this
# file set independently reproduces the conclusion Agol et al. (2021) draw from the densities: the TRAPPIST-1
# planets are depleted in iron relative to Earth. Take the absolute core fraction with caution, since a uniform
# incompressible core is a crude stand-in for a real one, and the recipe puts Earth's own core mass fraction at
# 0.354 against the accepted 0.325.
#
# Surface gravity is 10.1774 m/s2 and the central pressure 347 GPa. C/MR2 comes out at 0.35002; no TRAPPIST-1 planet
# has a measured moment of inertia, so that is a model output and not a check on the interior.
#
# Temperatures and viscosities
# Every layer carries a temperature and a reference-law viscosity at it (see io.toml): the core at 4000 K and 1e20
# Pa s, the mantle at 1600 K and 1e21 Pa s with the 300 kJ/mol silicate activation energy and an Andrade rheology
# (alpha = 0.3, zeta = 1). Nothing constrains either for a planet outside the solar system, so both are nominal
# Earth-like values and the tidal response follows them: change the mantle viscosity before reading any dissipation
# number off this file.
#
# Tides
# The planet is assumed tidally locked, so the spin frequency is the synchronous rate of its orbital period. At that
# period with e = 0.00401 (the magnitude of Agol et al. (2021)'s e cos w and e sin w) calc_tides puts 99.8 percent of
# the heating in the mantle (each layer's share of the radial solution's heating), unmoved in the fourth digit between
# that eccentricity and 0.01.
#
# Orbital state is not a world property in this schema; add the planet and its star to a System to give it an orbit.
schema_version = "0.2.0"
name = "TRAPPIST-1g"
type = "terrestrial"
radius_m = 7192868.0
mass_kg = 7.8892744e+24
spin_frequency_rad_s = 5.8872593e-06

# The layer temperatures below are prescribed, not solved: the fit holds at exactly these values, so the
# world pins the equation-of-state solve to keep them (a call may still pass solve_temperature = true).
[eos_solver]
solve_temperature = false

[layers.core]
layer_index = 0
radius_outer_m = 3108901.9           # fitted to the published mass
use_tides = true
temperature_k = 4000.0
use_heating = true

[layers.core.material.solid]
thermal_conductivity_w_mk = 7.95
heat_capacity_j_kgk = 840.0

[layers.core.material.solid.eos]
model = "constant"
reference_density_kg_m3 = 10900.0     # Earth's mean core density
bulk_modulus_pa = 1.6e11
thermal_expansion_1_k = 1.2e-5

[layers.core.material.solid.shear_modulus]
model = "constant"
shear_modulus_pa = 5.25e10

[layers.core.material.solid.shear_viscosity]
model = "reference"
reference_viscosity_pas = 1.0e20
reference_temperature_k = 4000.0
molar_activation_energy_j_mol = 3.0e5
molar_activation_volume_m3_mol = 0.0

[layers.core.shear_rheology]
model = "maxwell"

[layers.mantle]
layer_index = 1
radius_fraction = 1.0
use_tides = true
temperature_k = 1600.0
use_pressure_melting = true
use_melting = true
use_heating = true

[layers.mantle.material.solid]
thermal_conductivity_w_mk = 3.75

[layers.mantle.material.solid.eos]
model = "birch_murnaghan"
reference_density_kg_m3 = 3516.322    # the reference density of earth_simple
reference_bulk_modulus_pa = 1.28e11   # forsterite-like
bulk_modulus_derivative = 4.2
thermal_expansion_1_k = 5.2e-5

[layers.mantle.material.solid.shear_modulus]
model = "constant"
shear_modulus_pa = 6.0e10

[layers.mantle.material.solid.shear_viscosity]
model = "reference"
reference_viscosity_pas = 1.0e21
reference_temperature_k = 1600.0
molar_activation_energy_j_mol = 3.0e5
molar_activation_volume_m3_mol = 0.0

[layers.mantle.material]
latent_heat_j_kg = 4.0e5

[layers.mantle.material.liquid]
preset = "peridotite"                   # silicate melt

# Peridotite's melting curves (Monteux et al. 2016), which rise with pressure, and its Henning weakening.
[layers.mantle.material.melting]
preset = "peridotite"

[layers.mantle.shear_rheology]
model = "andrade"
alpha = 0.3
zeta = 1.0

[layers.mantle.cooling]
model = "convection"
convection_alpha = 1.0
convection_beta = 0.3333333333333333
critical_rayleigh = 1100.0

[layers.mantle.radiogenics]
model = "isotope"
isotopes = "modern_day_chondritic"
