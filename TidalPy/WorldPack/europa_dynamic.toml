# Europa-Dynamic: europa.toml with a subsurface ocean, solved as a dynamic, compressible liquid.
#
# The bundled europa.toml has no ocean: its 140 km water layer is solid ice. This file splits that layer 25 km
# below the surface into a 115 km liquid ocean under a 25 km ice shell and keeps the core, the mantle, their
# boundaries, and every temperature, viscosity, and rheology. The whole water layer, 140 km, matches the
# 138.7 +/- 7.7 km that Gomez Casajus et al. (2021, Icarus 358, 114187) derive from the Galileo and Juno gravity
# fields. The shell thickness is a representative value; published estimates run from a few km to about 30 km.
#
# Why the equation of state matters
# A dynamic liquid whose density does not follow its bulk modulus is unstably stratified: a constant-density
# liquid with a finite bulk modulus has N^2 = -rho g^2 / K < 0, and its solutions grow as exp(E), with E rising
# with the forcing period, until the integration fails. A pressure-dependent law keeps the density on
# d rho / dr = -rho^2 g / K, which is neutral (N^2 = 0), so a dynamic liquid stays well behaved at tidal periods.
# The dynamic liquids demo (Demos/Physics/P12_dynamic_liquids.ipynb) works through the difference.
#
# Ocean
# Birch-Murnaghan for liquid water at 273.15 K, fitted to the IAPWS-95 equation of state from 0 to 0.2 GPa:
# rho0 = 999.84 kg/m3, K_T0 = 1.937 GPa, K0' = 6.84, with a largest density misfit of 0.014 percent. The density
# runs from 1015 kg/m3 at the top of the ocean (0.031 GPa) to 1082 at its base (0.199 GPa), a mean of 1050.
#
# Fit
# The mantle's Birch-Murnaghan reference density, 3498.1963 kg/m3 (europa.toml: 3532.3413), gives the published
# mass. C/MR2 = 0.3457 lies within the 0.346 +/- 0.005 of Anderson et al. (1998) but 2.5 percent below the
# 0.3547 +/- 0.0024 of Gomez Casajus et al. (2021), the price of keeping europa.toml's layer boundaries. Surface
# gravity is 1.3147 m/s2 and the central pressure 4.79 GPa.
#
# Tides
# The ocean decouples the shell from the interior: k2 = 0.2594 at the 3.551181 day orbital period, with Q = 116,
# against 0.0153 for the ocean-free europa.toml. The same ocean solved as a static liquid gives k2 within
# 1.3e-3. At the default solver tolerance k2 holds to 5e-7 out to 1000 days.
#
# The temperatures, viscosities, and orbit are as documented in europa.toml.
schema_version = "0.2.0"
name = "Europa-Dynamic"
type = "terrestrial"
radius_m = 1561000.0
mass_kg = 4.7998e22
spin_frequency_rad_s = 2.047827e-05
albedo = 0.67

# The layer temperatures below are prescribed, not solved: the fits hold at exactly these values, so the
# world pins the equation-of-state solve to keep them (a call may still pass solve_temperature = true).
[eos_solver]
solve_temperature = false

[layers.core]
layer_index = 0
radius_outer_m = 599000.0
use_tides = true
temperature_k = 1500.0
use_heating = true

[layers.core.material.solid]
thermal_conductivity_w_mk = 7.95
heat_capacity_j_kgk = 840.0

[layers.core.material.solid.eos]
model = "constant"
reference_density_kg_m3 = 5150.0
bulk_modulus_pa = 1.6e11
thermal_expansion_1_k = 1.2e-5

[layers.core.material.solid.shear_modulus]
model = "constant"
shear_modulus_pa = 5.25e10

[layers.core.material.solid.shear_viscosity]
model = "reference"
reference_viscosity_pas = 1.0e20
reference_temperature_k = 1500.0
molar_activation_energy_j_mol = 3.0e5
molar_activation_volume_m3_mol = 0.0

[layers.core.shear_rheology]
model = "maxwell"

[layers.mantle]
layer_index = 1
radius_outer_m = 1421000.0
use_tides = true
temperature_k = 1400.0
use_pressure_melting = true
use_melting = true
use_heating = true

[layers.mantle.material.solid]
thermal_conductivity_w_mk = 3.75

[layers.mantle.material.solid.eos]
model = "birch_murnaghan"
reference_density_kg_m3 = 3498.1963   # fitted to the published mass
reference_bulk_modulus_pa = 1.28e11   # forsterite-like
bulk_modulus_derivative = 4.2
thermal_expansion_1_k = 5.2e-5

[layers.mantle.material.solid.shear_modulus]
model = "constant"
shear_modulus_pa = 6.0e10

[layers.mantle.material.solid.shear_viscosity]
model = "reference"
reference_viscosity_pas = 1.0e21
reference_temperature_k = 1400.0
molar_activation_energy_j_mol = 3.0e5
molar_activation_volume_m3_mol = 0.0

[layers.mantle.material]
latent_heat_j_kg = 4.0e5

[layers.mantle.material.liquid]
preset = "peridotite"                   # silicate melt

# Peridotite's melting curves (Monteux et al. 2016), which rise with pressure, and its Henning weakening.
[layers.mantle.material.melting]
preset = "peridotite"

[layers.mantle.shear_rheology]
model = "andrade"
alpha = 0.3
zeta = 1.0

[layers.mantle.cooling]
model = "convection"
convection_alpha = 1.0
convection_beta = 0.3333333333333333
critical_rayleigh = 1100.0

[layers.mantle.radiogenics]
model = "isotope"
isotopes = "modern_day_chondritic"

[layers.ocean]
layer_index = 2
radius_outer_m = 1536000.0            # under a 25 km ice shell
use_tides = false
is_static = false                     # subsurface ocean, solved with the dynamic equations
temperature_k = 273.0

[layers.ocean.material.liquid]
thermal_conductivity_w_mk = 2.3
heat_capacity_j_kgk = 2000.0

[layers.ocean.material.liquid.eos]
model = "birch_murnaghan"
reference_density_kg_m3 = 999.84      # liquid water at 273.15 K, fitted to IAPWS-95 to 0.2 GPa
reference_bulk_modulus_pa = 1.937e9
bulk_modulus_derivative = 6.84
thermal_expansion_1_k = 5.0e-5

[layers.ice_shell]
layer_index = 3
radius_fraction = 1.0
use_tides = true
temperature_k = 250.0
use_heating = true

[layers.ice_shell.material.solid]
thermal_conductivity_w_mk = 2.3
heat_capacity_j_kgk = 2000.0

[layers.ice_shell.material.solid.eos]
model = "birch_murnaghan"
reference_density_kg_m3 = 917.0
reference_bulk_modulus_pa = 9.6e9     # ice I
bulk_modulus_derivative = 5.5
thermal_expansion_1_k = 5.0e-5

[layers.ice_shell.material.solid.shear_modulus]
model = "constant"
shear_modulus_pa = 3.3e9

[layers.ice_shell.material.solid.shear_viscosity]
model = "reference"
reference_viscosity_pas = 1.0e15      # warm ice
reference_temperature_k = 250.0
molar_activation_energy_j_mol = 59.4e3
molar_activation_volume_m3_mol = 0.0

[layers.ice_shell.shear_rheology]
model = "maxwell"

[layers.ice_shell.cooling]
model = "convection"
convection_alpha = 1.0
convection_beta = 0.3333333333333333
critical_rayleigh = 1600.0
