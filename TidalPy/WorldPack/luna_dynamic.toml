# Luna-Dynamic: luna.toml with its fluid outer core solved as a dynamic, compressible liquid; only the core and
# the refitted numbers below differ.
# A constant-density dynamic liquid is unstably stratified and fails (luna.toml's core by a 10 day period), so
# the core's density follows its bulk modulus (see Demos/Physics/P12_dynamic_liquids.ipynb).
# Outer core: Birch-Murnaghan with Fe80S20 liquid K_T0 = 72.2 GPa, K0' = 4.75 (Nishida et al. 2020, Nat. Commun.
# 11, 1954); reference density 4803.56 kg/m3 fitted to the 5100 kg/m3 mean of Weber et al. (2011).
# Fitted: mantle reference density 3324.9486 kg/m3 to the mass (g = 1.6242 m/s2; central pressure 5.44 GPa);
# crust 33.98 km to C/MR2 = 0.39312; mantle rigidity 6.385106e10 Pa to k2 = 0.02422 at 27.3217 days.
# The zone is unchanged from luna.toml and still gives Q = 37.9 at the month and 41.0 at the year.
# At the default solver tolerances the yearly k2 is within 3e-4; tighten rtol and atol together for longer periods.
# With the temperature solved, the default tolerances give a negative monthly Q and an unphysical yearly k2
# (-0.54+0.09j) while love_success stays True. The monthly k2 then needs rtol = 1e-10 (atol 1e-13), so use this world
# isothermal (as pinned below) or tighten the radial tolerance.
# Temperatures, viscosities, and spin are as in luna.toml.
schema_version = "0.2.0"
name = "Luna-Dynamic"
type = "terrestrial"
radius_m = 1737400.0
mass_kg = 7.34579e22
spin_frequency_rad_s = 2.661667e-06
albedo = 0.12

# Temperatures are prescribed (the fits hold at these values), so the EOS solve keeps them.
[eos_solver]
solve_temperature = false

[layers.inner_core]
layer_index = 0
radius_outer_m = 160000.0
use_tides = true
temperature_k = 1700.0
use_heating = true

[layers.inner_core.material.solid]
thermal_conductivity_w_mk = 7.95
heat_capacity_j_kgk = 840.0

[layers.inner_core.material.solid.eos]
model = "constant"
reference_density_kg_m3 = 8000.0     # Weber et al. (2011)
bulk_modulus_pa = 1.6e11
thermal_expansion_1_k = 1.2e-5

[layers.inner_core.material.solid.shear_modulus]
model = "constant"
shear_modulus_pa = 5.25e10

[layers.inner_core.material.solid.shear_viscosity]
model = "reference"
reference_viscosity_pas = 1.0e20
reference_temperature_k = 1700.0
molar_activation_energy_j_mol = 3.0e5
molar_activation_volume_m3_mol = 0.0

[layers.inner_core.shear_rheology]
model = "maxwell"

[layers.outer_core]
layer_index = 1
radius_outer_m = 350000.0
use_tides = false
is_static = false
temperature_k = 1700.0

[layers.outer_core.material.liquid]
thermal_conductivity_w_mk = 7.95
heat_capacity_j_kgk = 840.0

[layers.outer_core.material.liquid.eos]
model = "birch_murnaghan"
reference_density_kg_m3 = 4803.5627  # fitted to a 5100 kg/m3 mean
reference_bulk_modulus_pa = 7.222252e10   # Fe80S20 liquid (Nishida et al. 2020)
bulk_modulus_derivative = 4.75
thermal_expansion_1_k = 1.2e-5

[layers.lower_mantle]
layer_index = 2
radius_outer_m = 475000.0             # fitted to Q
use_tides = true
temperature_k = 1600.0
use_pressure_melting = true
use_melting = true
use_heating = true

[layers.lower_mantle.material.solid]
thermal_conductivity_w_mk = 3.75

[layers.lower_mantle.material.solid.eos]
model = "birch_murnaghan"
reference_density_kg_m3 = 3324.9486   # the mantle's
reference_bulk_modulus_pa = 1.28e11
bulk_modulus_derivative = 4.2
thermal_expansion_1_k = 5.2e-5

[layers.lower_mantle.material.solid.shear_modulus]
model = "constant"
shear_modulus_pa = 6.385106e10        # the mantle's

[layers.lower_mantle.material.solid.shear_viscosity]
model = "reference"
reference_viscosity_pas = 4.241e16    # fitted to Q
reference_temperature_k = 1600.0
molar_activation_energy_j_mol = 3.0e5
molar_activation_volume_m3_mol = 0.0

[layers.lower_mantle.material]
latent_heat_j_kg = 4.0e5

[layers.lower_mantle.material.liquid]
preset = "peridotite"                   # silicate melt

# Peridotite melting curves (Monteux et al. 2016) with Henning weakening.
[layers.lower_mantle.material.melting]
preset = "peridotite"

[layers.lower_mantle.shear_rheology]
model = "maxwell"

[layers.lower_mantle.cooling]
model = "convection"
convection_alpha = 1.0
convection_beta = 0.3333333333333333
critical_rayleigh = 1100.0

[layers.lower_mantle.radiogenics]
model = "isotope"
isotopes = "modern_day_chondritic"

[layers.mantle]
layer_index = 3
radius_outer_m = 1703421.57            # fitted to C/MR2
use_tides = true
temperature_k = 1300.0
use_pressure_melting = true
use_melting = true
use_heating = true

[layers.mantle.material.solid]
thermal_conductivity_w_mk = 3.75

[layers.mantle.material.solid.eos]
model = "birch_murnaghan"
reference_density_kg_m3 = 3324.9486   # fitted to the mass
reference_bulk_modulus_pa = 1.28e11   # forsterite-like
bulk_modulus_derivative = 4.2
thermal_expansion_1_k = 5.2e-5

[layers.mantle.material.solid.shear_modulus]
model = "constant"
shear_modulus_pa = 6.385106e10        # fitted to k2

[layers.mantle.material.solid.shear_viscosity]
model = "reference"
reference_viscosity_pas = 1.0e23      # cold, dry lunar mantle
reference_temperature_k = 1300.0
molar_activation_energy_j_mol = 3.0e5
molar_activation_volume_m3_mol = 0.0

[layers.mantle.material]
latent_heat_j_kg = 4.0e5

[layers.mantle.material.liquid]
preset = "peridotite"                   # silicate melt

# Peridotite melting curves (Monteux et al. 2016) with Henning weakening.
[layers.mantle.material.melting]
preset = "peridotite"

[layers.mantle.shear_rheology]
model = "andrade"
alpha = 0.3
zeta = 1.0

[layers.mantle.cooling]
model = "convection"
convection_alpha = 1.0
convection_beta = 0.3333333333333333
critical_rayleigh = 1100.0

[layers.mantle.radiogenics]
model = "isotope"
isotopes = "modern_day_chondritic"

[layers.crust]
layer_index = 4
radius_fraction = 1.0
use_tides = true
temperature_k = 400.0
use_heating = true

[layers.crust.material.solid]
thermal_conductivity_w_mk = 3.75

[layers.crust.material.solid.eos]
model = "constant"
reference_density_kg_m3 = 2550.0      # GRAIL crustal grain density
bulk_modulus_pa = 7.5e10
thermal_expansion_1_k = 5.2e-5

[layers.crust.material.solid.shear_modulus]
model = "constant"
shear_modulus_pa = 4.0e10             # anorthositic crust

# Silicate creep referenced to the upper mantle (1e21 Pa s at 1600 K), elastic at crustal temperatures.
[layers.crust.material.solid.shear_viscosity]
model = "reference"
reference_viscosity_pas = 1.0e21
reference_temperature_k = 1600.0
molar_activation_energy_j_mol = 3.0e5
molar_activation_volume_m3_mol = 0.0

[layers.crust.shear_rheology]
model = "andrade"
alpha = 0.3
zeta = 1.0

[layers.crust.cooling]
model = "convection"
convection_alpha = 1.0
convection_beta = 0.3333333333333333
critical_rayleigh = 1100.0

[layers.crust.radiogenics]
model = "isotope"
isotopes = "modern_day_chondritic"
