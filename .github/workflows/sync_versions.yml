# Copies the version in pyproject.toml into every other file that repeats it, then commits the result back to
# the branch that was pushed.
#
# The commit is made with GITHUB_TOKEN, and pushes made with that token do not trigger workflows, so this cannot
# loop. Every substitution is checked: a pattern that stops matching is an error rather than a silent no-op,
# which is how the README badge sat on a stale version for several releases.

name: Sync Version Numbers

on:
  push:
    # Branches only. A tag push would check out the tag, leaving a detached HEAD with nothing to push back to.
    branches:
      - '**'
    paths:
      - 'pyproject.toml'
  workflow_dispatch:

# The job commits back to the repository.
permissions:
  contents: write

concurrency:
  group: sync-versions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Check out the branch itself, not the commit. github.head_ref is only set for pull request events, so
          # on this push-triggered workflow it expanded to an empty string and the checkout landed on a detached
          # HEAD, which is why the final push failed with "You are not currently on a branch".
          ref: ${{ github.ref }}
          fetch-depth: 0  # Fetch full history to get commit hash

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Update version in files
        run: |
          python - <<'EOF'
          import json
          import os
          import re
          import tomllib
          from datetime import date

          import yaml

          # Read version from pyproject.toml
          with open('pyproject.toml', 'rb') as f:
              pyproject = tomllib.load(f)
          version = pyproject['project']['version']
          print(f"Version from pyproject.toml: {version}")

          current_date = date.today().strftime('%Y-%m-%d')
          commit_hash = os.environ.get('GITHUB_SHA', 'unknown')[:7]  # Short hash

          print(f"Date: {current_date}")
          print(f"Commit: {commit_hash}")

          def substitute(content, pattern, replacement, description):
              """Apply one substitution and refuse to continue if it matched nothing."""
              content, count = re.subn(pattern, replacement, content)
              if count == 0:
                  raise SystemExit(f"Pattern for {description} matched nothing; the file or the version format "
                                   f"changed and this workflow needs updating.")
              print(f"  {description}: {count} substitution(s)")
              return content

          # Update citation.cff
          try:
              with open('citation.cff', 'r') as f:
                  citation = yaml.safe_load(f)

              citation['version'] = version
              citation['date-released'] = current_date
              citation['commit'] = commit_hash

              with open('citation.cff', 'w') as f:
                  yaml.dump(citation, f, sort_keys=False, default_flow_style=False)
              print("Updated citation.cff")
          except FileNotFoundError:
              print("citation.cff not found, skipping")

          # Update codemeta.json
          try:
              with open('codemeta.json', 'r') as f:
                  codemeta = json.load(f)

              codemeta['version'] = version
              codemeta['datePublished'] = current_date
              codemeta['dateModified'] = current_date

              with open('codemeta.json', 'w') as f:
                  json.dump(codemeta, f, indent=2, ensure_ascii=False)
                  f.write('\n')  # Add trailing newline
              print("Updated codemeta.json")
          except FileNotFoundError:
              print("codemeta.json not found, skipping")

          # Update meta.yaml, which carries the version as a jinja assignment: {% set version = "x.y.z" %}
          try:
              with open('meta.yaml', 'r') as f:
                  content = f.read()
              content = substitute(content, r'(\{%\s*set\s+version\s*=\s*")[^"]+(")',
                                   rf'\g<1>{version}\g<2>', 'meta.yaml jinja version')
              with open('meta.yaml', 'w') as f:
                  f.write(content)
              print("Updated meta.yaml")
          except FileNotFoundError:
              print("meta.yaml not found, skipping")

          # Update the README.md version badge. The version is a PEP 440 string and is regularly a pre-release
          # (0.8.0a1.dev2), so these patterns must not assume digits and dots.
          try:
              with open('README.md', 'r') as f:
                  content = f.read()

              content = substitute(content, r'(badge/TidalPy-)([^-]+)(-orange)',
                                   rf'\g<1>{version}\g<3>', 'README badge URL')
              content = substitute(content, r'(alt="TidalPy Version )([^"]+)(")',
                                   rf'\g<1>{version}\g<3>', 'README badge alt text')

              with open('README.md', 'w') as f:
                  f.write(content)

              print("Updated README.md")
          except FileNotFoundError:
              print("README.md not found, skipping")
          EOF

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet -- citation.cff codemeta.json meta.yaml README.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Version numbers are already in sync."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- citation.cff codemeta.json meta.yaml README.md
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add citation.cff codemeta.json meta.yaml README.md
          git commit -m "chore: sync version numbers from pyproject.toml"
          # Name the target branch explicitly so the push does not depend on how the checkout left HEAD.
          git push origin HEAD:${{ github.ref_name }}
