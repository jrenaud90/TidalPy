# Lints TidalPy and runs the full test suite across every supported CPython on Ubuntu, macOS, and Windows.
#
# TRIGGERS
#   push                a commit whose message contains "run tests"   -> requires admin approval
#   pull_request        any pull request, from anyone                 -> requires admin approval
#   schedule            weekly dependency-drift check                 -> runs immediately
#   workflow_dispatch   manual (already needs write access to click)  -> runs immediately
#
# The approval gate is the `approve-ci` job below. It is the only job bound to the `ci-approval` environment,
# and every other job waits on it.
name: Tests

on:
  workflow_dispatch:
  pull_request:
  push:
  schedule:
    - cron: '17 6 * * 1'

# Supersede an earlier run of the same branch or pull request; a scheduled run has its own group and is never
# cancelled by a later push.
concurrency:
  group: tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

permissions:
  contents: read

env:
  TIDALPY_TEST_MODE: 1
  # The Python versions that install the optional burnman extra. Comparing the matrix value numerically does not
  # work: "3.9" parses as 3.9, which is greater than 3.13, so a numeric test silently drops 3.9.
  BURNMAN_PYTHONS: '["3.9", "3.10", "3.11", "3.12"]'

jobs:
  # Holds the run until a required reviewer approves it. Skipped outright for schedule and workflow_dispatch,
  # and for a push that did not ask for CI -- the jobs below tell those two cases apart by `result`.
  approve-ci:
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, 'run tests'))

    name: Approve CI run
    runs-on: ubuntu-latest
    environment: ci-approval
    steps:
      - name: Approved
        run: echo "Approved by ${{ github.actor }}; running the test suite."

  lint-with-ruff:
    needs: approve-ci
    # `!cancelled()` is what lets this job evaluate at all when `approve-ci` was skipped; without a status
    # function here, a skipped dependency skips the dependent unconditionally.
    if: |
      !cancelled() && (
        needs.approve-ci.result == 'success' ||
        ((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
         needs.approve-ci.result == 'skipped')
      )

    name: Lint TidalPy with ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'true'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff linting
        run: ruff check TidalPy/ --ignore F401,E402,E501 --select E,F

  test:
    needs: approve-ci
    if: |
      !cancelled() && (
        needs.approve-ci.result == 'success' ||
        ((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
         needs.approve-ci.result == 'skipped')
      )

    name: Test on ${{ matrix.os-name }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is arm64, matching the toolchain cibuildwheel uses for the macOS wheels.
        include:
          - {os: ubuntu-latest,  os-name: Ubuntu}
          - {os: macos-latest,   os-name: MacOS}
          - {os: windows-latest, os-name: Windows}
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'true'

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install Test Dependencies
        run: python -m pip install pytest pytest-xdist

      - name: Install Package with Burnman
        if: ${{ contains(fromJSON(env.BURNMAN_PYTHONS), matrix.python-version) }}
        run: python -m pip install -v .[burnman]

      - name: Install Package (No Burnman)
        if: ${{ !contains(fromJSON(env.BURNMAN_PYTHONS), matrix.python-version) }}
        run: python -m pip install -v .

      # --capture=sys leaves file-descriptor output alone, so the C++ backend's spdlog messages still reach the
      # log; pytest's default capture would swallow them.
      - name: Run pytest
        run: pytest -n auto --capture=sys -v Tests/
